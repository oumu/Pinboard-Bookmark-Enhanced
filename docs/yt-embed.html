<!doctype html>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Video embed</title>
<style>html,body{margin:0;height:100%;background:#000}#player,iframe{border:0;width:100%;height:100%;display:block}</style>
<body>
<div id="player"></div>
<script>
// Relay page: an extension page cannot embed YouTube directly because Chrome
// sends no Referer from chrome-extension:// frames and YouTube's IFrame API
// rejects that with error 153. This page lives on the project's GitHub Pages
// origin, so YouTube sees a real https referrer.
//
// It speaks a tiny two-way protocol with its opener (the reader):
//   inbound  {pbpVideo:1, func:"hello"|"seekTo"|"playVideo", args:[]}
//   outbound {pbpVideo:1, event:"ready"}
//            {pbpVideo:1, event:"time", t:<seconds>, state:<YT state int>, d?:<duration seconds, once known>}
// `state` (YT.PlayerState) is read by the reader: PLAYING gates the cue loop and
// position saves, a PAUSED report is saved as the resting position, ENDED clears it.
//
// Two player modes. Normally YouTube's IFrame API builds the player and the
// outbound half works. When that script never arrives -- content blockers
// (uBlock Origin and friends), a DNS sinkhole, an offline moment -- a ~3s
// timer falls back to the plain <iframe> embed this page used before the
// two-way protocol existed: commands still work (forwarded as the classic
// JSON "command" messages), position reporting does not. Degrading to
// pre-protocol behaviour beats degrading to a black box.
//
// Privacy stance for the outbound half: the ONLY thing that ever leaves this
// page is the playback position of a public video the user is watching right
// now, plus the player's own state integer and, once the player knows it, the video's total duration (the same public figure the YouTube page displays). No identifiers, no cookies, no
// account data, nothing read out of the YouTube frame. And it goes to exactly
// one place: the origin that proved itself by messaging in first (captured
// from that message's e.origin). Before that handshake this page posts
// NOTHING -- there is no targetOrigin "*" anywhere here, and no fallback that
// would introduce one.
(function () {
  var id = new URLSearchParams(location.search).get("v") || "";
  if (!/^[\w-]{6,20}$/.test(id)) return;

  var player = null;        // YT.Player once the API has built it
  var ready = false;        // player fired onReady
  var parentOrigin = "";    // armed by the first valid inbound message
  var readySent = false;
  var timer = 0;            // 250ms position reporter, PLAYING state only
  var pendingSeek = null;   // a seek that arrived before the player existed
  var pendingPlay = false;  // a playVideo that arrived before the player existed (retro #14)
  var pendingRate = null;   // a setPlaybackRate that arrived before the player existed
  var apiFired = false;     // onYouTubeIframeAPIReady ran (API script arrived)
  var readyTimer = 0;       // no-onReady fallback timer, cleared by onReady
  var fallbackFrame = null; // plain <iframe> embed when the API never arrives

  function post(msg) {
    if (!parentOrigin) return; // not armed: stay silent
    try { window.parent.postMessage(msg, parentOrigin); } catch (_) {}
  }

  function postReady() {
    if (readySent || !ready || !parentOrigin) return;
    readySent = true;
    post({ pbpVideo: 1, event: "ready" });
  }

  function postTime() {
    if (!player || typeof player.getCurrentTime !== "function") return;
    var t, state, dur;
    try {
      t = player.getCurrentTime();
      state = typeof player.getPlayerState === "function" ? player.getPlayerState() : -1;
      dur = typeof player.getDuration === "function" ? player.getDuration() : NaN;
    } catch (_) { return; }
    if (typeof t !== "number" || !isFinite(t)) return;
    var msg = { pbpVideo: 1, event: "time", t: t, state: state };
    // Duration only when the player knows it (0 / NaN before metadata): the
    // reader treats an absent field as "unknown" and keeps its caption-tail
    // estimate, so no sentinel value is ever sent.
    if (typeof dur === "number" && isFinite(dur) && dur > 0) msg.d = dur;
    post(msg);
  }

  function stopTimer() { if (timer) { clearInterval(timer); timer = 0; } }

  function onStateChange(ev) {
    var state = ev && typeof ev.data === "number" ? ev.data : -1;
    stopTimer();
    // One report on every state change, the non-playing ones included: the
    // position at the moment playback stopped is the last true one, so the
    // reader's row marker settles where the player actually is instead of
    // wherever the final 250ms tick happened to land. The `state` field is
    // read by the reader: PLAYING gates the cue loop and position saves, a
    // PAUSED report is saved as the resting position, ENDED clears it.
    postTime();
    if (state === 1 /* YT.PlayerState.PLAYING */) timer = setInterval(postTime, 250);
  }

  function onReady() {
    ready = true;
    if (readyTimer) { clearTimeout(readyTimer); readyTimer = 0; }
    // Replay what arrived early, each verb with its own meaning: a seek is
    // just a seek (continue-watching must not autoplay), play only if play
    // was asked for, and a rate that was set before ready is not lost.
    if (pendingSeek !== null) {
      var s = pendingSeek;
      pendingSeek = null;
      try { player.seekTo(s, true); } catch (_) {}
    }
    if (pendingRate !== null) {
      var r0 = pendingRate;
      pendingRate = null;
      try { player.setPlaybackRate(r0); } catch (_) {}
    }
    if (pendingPlay) {
      pendingPlay = false;
      try { player.playVideo(); } catch (_) {}
    }
    postReady(); // no-op until the handshake arms parentOrigin
  }

  // ---- fallback mode: no IFrame API ----
  // Classic command channel of the plain embed: a JSON string, posted to
  // youtube.com. This is exactly what this page did before the two-way
  // protocol, kept alive for the blocked-API case.
  function forward(func, args) {
    if (!fallbackFrame || !fallbackFrame.contentWindow) return;
    try {
      fallbackFrame.contentWindow.postMessage(JSON.stringify({
        event: "command", func: func, args: args || []
      }), "https://www.youtube.com");
    } catch (_) {}
  }

  // Guarded in BOTH directions against a double mount: this bails once the
  // API has fired or a player exists, and onYouTubeIframeAPIReady bails once
  // this has mounted (a late API arrival must not build a second player on
  // top of a working fallback, nor reach for the #player div this replaced).
  function mountFallback() {
    if (fallbackFrame || player || apiFired) return;
    var f = document.createElement("iframe");
    f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen"; // autoplay delegated through: "play from here" must play, not only seek (review C5)
    f.allowFullscreen = true;
    f.src = "https://www.youtube.com/embed/" + id +
      "?enablejsapi=1&rel=0&origin=" + encodeURIComponent(location.origin);
    f.addEventListener("load", function () {
      if (pendingSeek !== null) { var s = pendingSeek; pendingSeek = null; forward("seekTo", [s, true]); }
      if (pendingRate !== null) { var r0 = pendingRate; pendingRate = null; forward("setPlaybackRate", [r0]); }
      if (pendingPlay) { pendingPlay = false; forward("playVideo", []); }
    });
    var host = document.getElementById("player");
    if (host && host.parentNode) host.parentNode.replaceChild(f, host);
    else document.body.appendChild(f);
    fallbackFrame = f;
    // No position reporting in this mode: there is no player object to ask.
    // The reader's greeting simply goes unanswered and it stops asking.
  }
  setTimeout(mountFallback, 3000);

  // Inbound half. The gate is EXACTLY as strict as it was before the
  // two-way protocol landed: this page is only ever framed by the reader, so
  // a message from anything other than our own parent is not ours to act on,
  // and the command allowlist stays as defence in depth behind that check.
  // (The sender is a chrome-extension:// origin whose id differs between the
  // unpacked and Web Store builds, so identity is established by "is my
  // parent" rather than by matching a hardcoded origin string -- which is
  // also why the reply origin has to be learned from the message itself.)
  window.addEventListener("message", function (e) {
    if (window.parent === window || e.source !== window.parent) return;
    var d = e.data;
    if (!d || typeof d !== "object" || d.pbpVideo !== 1) return;
    // Allowlist (research T3.1 added pauseVideo + setPlaybackRate): still a
    // closed set -- the reader speaks these five verbs, nothing else.
    if (d.func !== "seekTo" && d.func !== "playVideo" && d.func !== "hello"
        && d.func !== "pauseVideo" && d.func !== "setPlaybackRate") return;
    // Arm outbound reporting on the FIRST valid inbound message -- and only
    // for an extension parent (audit B8): the reader is the one legitimate
    // embedder, and its origin is always chrome-extension:// (the id differs
    // between unpacked and Web Store builds, the scheme never does). "null"
    // is what an opaque origin serializes to and is not a legal postMessage
    // target, so it never arms anything.
    if (!parentOrigin && e.origin && e.origin.indexOf("chrome-extension://") === 0) {
      parentOrigin = e.origin;
      postReady(); // the player may already have been ready before this
    }
    // Once armed, later messages must still come from that same origin: a
    // parent that navigated cross-origin keeps the same WindowProxy, so the
    // source check alone stops proving identity (audit B8).
    if (parentOrigin && e.origin !== parentOrigin) return;
    // Never armed (non-extension parent): commands are not ours to run
    // either (closing review L4) -- arming is the admission ticket.
    if (!parentOrigin) return;
    if (d.func === "hello") return;
    var args = Array.isArray(d.args) ? d.args : [];
    if (d.func === "seekTo") {
      var sec = Number(args[0]);
      if (!isFinite(sec) || sec < 0) return;
      if (fallbackFrame) { forward("seekTo", [sec, true]); return; }
      if (!player || typeof player.seekTo !== "function") { pendingSeek = sec; return; }
      try { player.seekTo(sec, true); } catch (_) {}
      return;
    }
    if (d.func === "pauseVideo") {
      pendingPlay = false; // a pause after an early play cancels it
      if (fallbackFrame) { forward("pauseVideo", []); return; }
      if (!player || typeof player.pauseVideo !== "function") return;
      try { player.pauseVideo(); } catch (_) {}
      return;
    }
    if (d.func === "setPlaybackRate") {
      // Bounded to what the IFrame API accepts; anything else is dropped.
      var rate = Number(args[0]);
      if (!isFinite(rate) || rate < 0.25 || rate > 2) return;
      if (fallbackFrame) { forward("setPlaybackRate", [rate]); return; }
      if (!player || typeof player.setPlaybackRate !== "function") { pendingRate = rate; return; }
      try { player.setPlaybackRate(rate); } catch (_) {}
      return;
    }
    if (fallbackFrame) { forward("playVideo", []); return; }
    if (!player || typeof player.playVideo !== "function") { pendingPlay = true; return; }
    try { player.playVideo(); } catch (_) {}
  });

  // youtube.com, NOT youtube-nocookie.com. The privacy-enhanced domain is a
  // separate registrable domain, so the viewer's youtube.com login cookies
  // never reach it; an anonymous embed then routinely trips YouTube's
  // "confirm you're not a bot" gate even for a signed-in viewer. Using the
  // main domain lets the existing session identify the viewer, at the cost of
  // the cookies that domain sets (disclosed in privacy.md).
  // The API firing is not the player working (audit B8): the constructor can
  // throw, the player can call onError, or onReady can simply never come --
  // and the old apiFired latch then blocked the fallback forever, a black
  // box. The latch now releases on every one of those, and a ready-timeout
  // covers the silent case.
  function apiPathFailed() {
    if (ready || fallbackFrame) return;
    try { if (player && typeof player.destroy === "function") player.destroy(); } catch (_) {}
    player = null;
    apiFired = false;
    mountFallback();
  }
  window.onYouTubeIframeAPIReady = function () {
    apiFired = true;
    if (fallbackFrame) return; // the fallback already owns the frame
    try {
      player = new YT.Player("player", {
        videoId: id,
        width: "100%",
        height: "100%",
        playerVars: { enablejsapi: 1, rel: 0, origin: location.origin },
        events: {
          onReady: onReady,
          onStateChange: onStateChange,
          onError: function () { apiPathFailed(); }
        }
      });
    } catch (_) { apiPathFailed(); return; }
    readyTimer = setTimeout(apiPathFailed, 8000); // no onReady by then -> plain embed
  };
  var api = document.createElement("script");
  api.src = "https://www.youtube.com/iframe_api";
  // A blocked request usually fails fast and loudly -- take the shortcut to
  // the fallback instead of making the user watch a black box for 3s. The
  // timer above still covers the silent cases (script served but neutered,
  // DNS blackhole that hangs).
  api.addEventListener("error", mountFallback);
  document.head.appendChild(api);
})();
</script>
</body>
