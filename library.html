<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="light dark" />
  <title>Notes &amp; Vocabulary</title>
  <script src="options-theme-early.js"></script>
  <link rel="stylesheet" href="library.css">
</head>
<body>
  <header class="lib-header">
    <h1 data-i18n="libraryTitle">Notes &amp; Vocabulary</h1>
    <nav class="lib-tabs" role="tablist" data-i18n-aria="libraryTitle" aria-label="Notes &amp; Vocabulary">
      <button type="button" class="lib-tab" id="lib-tab-vocab" role="tab" aria-selected="true" aria-controls="view-vocab" data-i18n="dictVocabSection">Vocabulary</button>
      <button type="button" class="lib-tab" id="lib-tab-notes" role="tab" aria-selected="false" aria-controls="view-notes" data-i18n="tabNotes">Notes</button>
    </nav>
  </header>

  <main class="lib-main">
    <section id="view-vocab" class="lib-view" role="tabpanel" aria-labelledby="lib-tab-vocab">
      <div class="vocab-workbench">
        <div class="vocab-list-pane">
      <div class="notes-toolbar vocab-filter-toolbar">
        <input type="search" id="vocab-search" placeholder="Search words, definitions, context, and groups" data-i18n-placeholder="vocabSearchPlaceholder" data-i18n-aria="vocabSearchPlaceholder" aria-label="Search words, definitions, context, and groups" autocomplete="off" />
        <!-- One flex unit: the three selects travel together. Beside the
             search when the row fits, as one full second row when it
             doesn't -- never scattered one-per-line. -->
        <div class="vocab-filter-selects">
        <label class="sr-only" for="vocab-group-filter" data-i18n="vocabGroupFilterAria">Filter by group</label>
        <select id="vocab-group-filter" data-i18n-aria="vocabGroupFilterAria" aria-label="Filter by group"><option value="" data-i18n="vocabAllGroups">All groups</option></select>
        <label class="sr-only" for="vocab-status-filter" data-i18n="vocabStatusFilterAria">Filter by status</label>
        <select id="vocab-status-filter" data-i18n-aria="vocabStatusFilterAria" aria-label="Filter by status">
          <option value="" data-i18n="vocabStatusAll">All statuses</option>
          <option value="new" data-i18n="vocabStatusLearning">Learning</option>
          <option value="known" data-i18n="vocabStatusKnown">Known</option>
        </select>
        <label class="sr-only" for="vocab-sort" data-i18n="vocabSortAria">Sort vocabulary</label>
        <!-- Hidden state carrier: every handler/test still speaks to this
             select; the two segment buttons below only proxy writes to it.
             (user-ratified 2026-08-02: dropdown -> direction-toggle pair) -->
        <select id="vocab-sort" data-i18n-aria="vocabSortAria" aria-label="Sort vocabulary" hidden>
          <option value="latest" data-i18n="vocabSortLatest">Recently updated</option>
          <option value="oldest" data-i18n="vocabSortOldest">Least recently updated</option>
          <option value="az" data-i18n="vocabSortAz">A–Z</option>
          <option value="za" data-i18n="vocabSortZa">Z–A</option>
        </select>
        <span class="vocab-sort-seg" role="group" data-i18n-aria="vocabSortAria" aria-label="Sort vocabulary">
          <button type="button" class="btn btn-sm vocab-sort-btn" id="vocab-sort-time" aria-pressed="true" aria-label="Least recently updated" title="Least recently updated"><span class="btn-ic" data-ic="clockArrowDown"></span></button>
          <button type="button" class="btn btn-sm vocab-sort-btn" id="vocab-sort-alpha" aria-pressed="false" aria-label="A–Z" title="A–Z"><span class="btn-ic" data-ic="arrowDownAZ"></span></button>
        </span>
        </div>
      </div>
      <!-- Read-only stats strip: total/learning/known/groups/languages/recent,
           computed from the full owner row set (not the filtered view). The
           two status counts are also filter chips (click = set/clear
           #vocab-status-filter and reuse the existing change pipeline). -->
      <div id="vocab-stats" class="vocab-stats" hidden>
        <span class="vocab-stat" id="vocab-stat-total"></span>
        <button type="button" class="vocab-stat-chip" id="vocab-stat-learning" data-status="new" aria-pressed="false"></button>
        <button type="button" class="vocab-stat-chip" id="vocab-stat-known" data-status="known" aria-pressed="false"></button>
        <span class="vocab-stat" id="vocab-stat-groups"></span>
        <span class="vocab-stat" id="vocab-stat-languages"></span>
        <span class="vocab-stat" id="vocab-stat-recent"></span>
      </div>
      <!-- Count line: identical in browse and selection. The batch tools
           live in the sticky bar inside .vocab-list-region below -- nothing
           here reserves geometry for them. The status message rides inline
           at the right edge instead of holding a line of its own. -->
      <div class="vocab-context-bar" id="vocab-context-bar">
        <span class="vocab-ctx-text">
          <span id="vocab-count" class="notes-count" aria-live="polite"></span>
        </span>
        <div class="vocab-selection-actions" role="group" data-i18n-aria="vocabSelectionActions" aria-label="Selection actions">
          <button type="button" class="btn btn-sm" id="vocab-select-all" data-i18n="vocabSelectAll">Select all</button>
        </div>
        <span class="save-status vocab-main-status" id="vocab-status" role="status" aria-live="polite"></span>
      </div>
      <div id="vocab-empty" class="notes-empty" hidden>No saved words yet. Save words from the reader's dictionary view.</div>
      <div id="vocab-no-results" class="notes-empty" data-i18n="vocabNoResults" hidden>No words match the current filters.</div>
      <!-- Sticky boundary: the batch bar floats ONLY within this wrapper.
           The bar MUST stay a direct child -- any intermediate wrapper
           becomes its containing block and kills the float range. -->
      <div class="vocab-list-region">
        <div id="vocab-list" role="list" data-i18n-aria="vocabListAria" aria-label="Saved vocabulary" aria-busy="false"></div>
        <button type="button" class="btn btn-sm vocab-load-more" id="vocab-load-more" hidden>Load more</button>
        <div class="vocab-batch-bar" id="vocab-batch-toolbar" role="group" data-i18n-aria="vocabBatchActions" aria-label="Actions for selected words">
          <span id="vocab-selected-count" class="notes-count" aria-live="polite"></span>
          <!-- Icon-only bar actions (user-ratified 2026-08-02: save width, dodge
               long-locale labels). Status pair mirrors the dict view's icons
               (known=checkCircle / learning=rotateCcw); trash claims destroy,
               cross stays on clear (the popup "clear all"/"clear" family). -->
          <button type="button" class="btn btn-sm" id="vocab-invert-selection" data-i18n-title="vocabInvertSelection" data-i18n-aria="vocabInvertSelection" aria-label="Invert selection" title="Invert selection"><span class="btn-ic" data-ic="arrowRightLeft"></span></button>
          <!-- Input + stepper unit (icon audit P0): +/- are icon-only because the
               Group-name placeholder disambiguates them; full labels stay in
               title/aria (remove's title is JS-owned, see _pbpVocabSyncSelectionUi). -->
          <span class="vocab-group-unit">
            <input type="text" id="vocab-group-input" list="vocab-group-list" placeholder="Group name" data-i18n-placeholder="vocabGroupNamePlaceholder" data-i18n-aria="vocabGroupNamePlaceholder" aria-label="Group name" autocomplete="off" />
            <datalist id="vocab-group-list"></datalist>
            <button type="button" class="btn btn-sm vocab-group-step" id="vocab-add-group" data-i18n-title="vocabAddToGroup" data-i18n-aria="vocabAddToGroup"><span class="btn-ic" data-ic="plus"></span></button>
            <button type="button" class="btn btn-sm vocab-group-step" id="vocab-remove-group" data-i18n-aria="vocabRemoveFromGroup"><span class="btn-ic" data-ic="minus"></span></button>
          </span>
          <span class="vocab-batch-cluster">
            <button type="button" class="btn btn-sm" id="vocab-mark-known" data-i18n-title="vocabMarkKnown" data-i18n-aria="vocabMarkKnown" aria-label="Mark as known" title="Mark as known"><span class="btn-ic" data-ic="checkCircle"></span></button>
            <button type="button" class="btn btn-sm" id="vocab-mark-learning" data-i18n-title="vocabMarkLearning" data-i18n-aria="vocabMarkLearning" aria-label="Back to learning" title="Back to learning"><span class="btn-ic" data-ic="rotateCcw"></span></button>
          </span>
          <button type="button" class="btn btn-sm danger" id="vocab-batch-delete" data-i18n-title="vocabBatchDelete" data-i18n-aria="vocabBatchDelete" aria-label="Delete selected" title="Delete selected"><span class="btn-ic" data-ic="trash"></span></button>
          <button type="button" class="btn btn-sm vocab-clear-selection" id="vocab-clear-selection" data-i18n-title="vocabClearSelection" data-i18n-aria="vocabClearSelection" aria-label="Clear selection" title="Clear selection"><span class="btn-ic" data-ic="cross"></span></button>
        </div>
      </div>
        </div>
        <aside class="vocab-detail-pane" id="vocab-detail-pane" aria-label="Word details" data-i18n-aria="libraryDetailTitle">
          <div class="vocab-detail-empty" id="vocab-detail-empty" data-i18n="libraryDetailEmpty">Select a word on the left to see its details.</div>
          <div class="vocab-detail" id="vocab-detail" hidden></div>
        </aside>
      </div>
    </section>
    <section id="view-notes" class="lib-view" role="tabpanel" aria-labelledby="lib-tab-notes" hidden>
      <div class="notes-toolbar">
        <input type="search" id="notes-filter" placeholder="Filter titles and notes" data-i18n-placeholder="notesFilterPlaceholder" data-i18n-aria="notesFilterPlaceholder" aria-label="Filter titles and notes" />
        <span id="notes-count" class="notes-count" aria-live="polite"></span>
        <div id="notes-color-filters" class="notes-color-filters" role="group" data-i18n-aria="hlFilterGroupAria" aria-label="Filter highlights by color"></div>
      </div>
      <div id="notes-list"></div>
    </section>
  </main>

  <script defer src="i18n.js"></script>
  <script defer src="shared.js"></script>
  <script defer src="vocab-store.js"></script>
  <script defer src="ai-cache.js"></script>
  <script defer src="md-dict.js"></script>
  <script defer src="dict-pack.js"></script>
  <script defer src="library-notes.js"></script>
  <script defer src="library-vocab.js"></script>
  <script defer src="library.js"></script>
</body>
</html>
