<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- CI font parity for the UI gates (2026-09-06). The GitHub Ubuntu runner has
     DejaVu / Liberation / Noto and no Windows fonts; WSL on a Windows host
     borrows Segoe UI through fontconfig, so a `line-height: normal` control
     measures 25.33px here and 24.67px on CI. Run any browser suite or the
     render sweep with this file to see what CI sees:
       FONTCONFIG_FILE=scripts/ci-fonts.conf node scripts/ui-render-audit.mjs --sweep
       FONTCONFIG_FILE=scripts/ci-fonts.conf node .qa-scan/run-test.mjs tests/<suite>.html
     The real fix for anything it flags is always a px pin (height / min-height
     / line-height), never a font-specific number. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <cachedir>~/.cache/pbp-ci-fonts</cachedir>
  <alias><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>-apple-system</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>BlinkMacSystemFont</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Segoe UI</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Helvetica Neue</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>PingFang SC</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Microsoft YaHei</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Hiragino Sans</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
