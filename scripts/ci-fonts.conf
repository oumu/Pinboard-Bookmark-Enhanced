<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- CI font parity for the UI gates (2026-09-06). The GitHub Ubuntu runner has
     DejaVu / Liberation plus the Playwright font deps (WenQuanYi Zen Hei for
     CJK, IPAGothic, FreeFont, Unifont) and no Windows fonts; WSL on a Windows
     host borrows Segoe UI / Microsoft YaHei through fontconfig, so a
     `line-height: normal` control measures 25.33px here and 24.67px on CI and
     CJK ink sits ~1 CSS px lower under YaHei than under WenQuanYi. Run any
     browser suite, the render sweep or the raster audit with this file to see
     what CI sees. fontconfig wants an ABSOLUTE path (a relative one is looked
     up under /etc/fonts, fails, and silently falls back to the default config)
     and this comment must never contain a double hyphen (XML forbids it inside
     comments; the file then fails to parse and is silently ignored too):
       FONTCONFIG_FILE="$PWD/scripts/ci-fonts.conf" node scripts/ui-render-audit.mjs (add the sweep flag as needed)
       FONTCONFIG_FILE="$PWD/scripts/ci-fonts.conf" node scripts/options-help-render-audit.mjs
       FONTCONFIG_FILE="$PWD/scripts/ci-fonts.conf" node .qa-scan/run-test.mjs tests/<suite>.html
     Sanity check that it loaded: fc-match with the same variable must resolve
     "Microsoft YaHei" to DejaVu Sans, not msyh.ttc.
     The real fix for anything it flags is always a px pin (height / min-height
     / line-height) or a baseline anchor, never a font-specific number. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <!-- Fonts installed on this machine but absent from the CI runner: hide them so
       per-glyph fallback lands where CI's does (CJK on WenQuanYi Zen Hei). -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/opentype/noto/NotoSansCJK*</glob>
      <glob>/usr/share/fonts/opentype/noto/NotoSerifCJK*</glob>
      <glob>/usr/share/fonts/truetype/droid/*</glob>
    </rejectfont>
  </selectfont>
  <cachedir>~/.cache/pbp-ci-fonts</cachedir>
  <alias><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>-apple-system</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>BlinkMacSystemFont</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Segoe UI</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Helvetica Neue</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>PingFang SC</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Microsoft YaHei</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Hiragino Sans</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
