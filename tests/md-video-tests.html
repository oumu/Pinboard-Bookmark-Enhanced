<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>md-video Tests</title>
<style>
body { font-family: monospace; padding: 16px; max-width: 1000px; }
.case { padding: 6px; border-bottom: 1px solid #eee; white-space: pre-wrap; }
.pass { color: #0a0; } .fail { color: #c00; font-weight: bold; }
h2 { margin-top: 24px; }
</style></head>
<body>
<h1>md-video.js tests</h1>
<div id="summary"></div>
<div id="results"></div>

<script src="../md-video.js"></script>
<script>
const root = document.getElementById("results");
let pass = 0, fail = 0;
function check(name, cond, detail) {
  const ok = !!cond; ok ? pass++ : fail++;
  const div = document.createElement("div");
  div.className = "case " + (ok ? "pass" : "fail");
  div.textContent = `${ok ? "✓" : "✗"}  ${name}${ok ? "" : "\n   " + (detail || "")}`;
  root.appendChild(div);
}
function section(name) { const h = document.createElement("h2"); h.textContent = name; root.appendChild(h); }
function assert(cond, detail) { check(detail || String(cond), cond, detail); }
function assertEq(a, e, label) {
  const ok = a === e;
  check(label || (String(e) + " === " + String(a)), ok, ok ? "" : "expected " + JSON.stringify(e) + " got " + JSON.stringify(a));
}

(async function () {

section("pbpVideoDetect");
assertEq(pbpVideoDetect("https://www.youtube.com/watch?v=dQw4w9WgXcQ").videoId, "dQw4w9WgXcQ", "watch URL");
assertEq(pbpVideoDetect("https://m.youtube.com/watch?v=dQw4w9WgXcQ&t=42s").videoId, "dQw4w9WgXcQ", "mobile watch URL with extra params");
assertEq(pbpVideoDetect("https://youtu.be/dQw4w9WgXcQ?si=xyz").videoId, "dQw4w9WgXcQ", "youtu.be short link");
assertEq(pbpVideoDetect("https://www.youtube.com/shorts/abcDEF12345").videoId, "abcDEF12345", "shorts URL");
assertEq(pbpVideoDetect("https://www.youtube.com/watch?v=dQw4w9WgXcQ").provider, "youtube", "provider tag");
assertEq(pbpVideoDetect("https://example.com/watch?v=dQw4w9WgXcQ"), null, "non-YouTube host is null");
assertEq(pbpVideoDetect("https://www.youtube.com/feed/subscriptions"), null, "non-video YouTube page is null");
assertEq(pbpVideoDetect("not a url"), null, "garbage is null");

section("pbpYtParseTranscriptPanel");
(() => {
  // Hand-written from the real get_transcript response shape (verified via
  // page-assist's shipping parser): actions -> updateEngagementPanelAction
  // -> transcriptRenderer -> ... -> initialSegments -> transcriptSegmentRenderer.
  const panelResp = { actions: [{ updateEngagementPanelAction: { content: { transcriptRenderer: { content: {
    transcriptSearchPanelRenderer: { body: { transcriptSegmentListRenderer: { initialSegments: [
      { transcriptSegmentRenderer: { startMs: "1200", endMs: "3100", snippet: { runs: [{ text: "hello " }, { text: "world" }] } } },
      { transcriptSegmentRenderer: { startMs: "3200", endMs: "5000", snippet: { runs: [{ text: "  second   line " }] } } },
      { transcriptSectionHeaderRenderer: { } },
    ] } } } } } } } }] };
  const segs = pbpYtParseTranscriptPanel(panelResp);
  assertEq(segs.length, 2, "two text segments parsed, header renderer skipped");
  assertEq(segs[0].content, "hello world", "runs joined into one text");
  assert(Math.abs(segs[0].from - 1.2) < 1e-9 && Math.abs(segs[0].to - 3.1) < 1e-9, "startMs/endMs converted to seconds");
  assertEq(segs[1].content, "second line", "whitespace collapsed");
  const contResp = { actions: [{ appendContinuationItemsAction: { continuationItems: [
    { transcriptSegmentRenderer: { startMs: "0", endMs: "900", snippet: { runs: [{ text: "cont" }] } } },
  ] } }] };
  assertEq(pbpYtParseTranscriptPanel(contResp).length, 1, "continuation items accepted");
  assertEq(pbpYtParseTranscriptPanel({}).length, 0, "no actions -> empty");
  assertEq(pbpYtParseTranscriptPanel(null).length, 0, "null -> empty");
})();

section("pbpYtParseTranscriptDeep");
(() => {
  // PAmodern /get_panel grade: viewmodel rows under shifting wrappers --
  // fixture nesting mirrors the shape reported by youtube-transcript-downloader.
  const panelGrade = { some: { wrapper: { contents: [
    { itemSectionRenderer: { contents: [ { deep: { transcriptSegmentViewModel: { timestamp: "1:05", simpleText: "view model row" } } } ] } },
    { transcriptSegmentViewModel: { timestamp: { simpleText: "12:34" }, simpleText: "second row" } },
  ] } } };
  const vm = pbpYtParseTranscriptDeep(panelGrade);
  check("deep: viewmodel rows found under arbitrary nesting", vm.length === 2 && vm[0].content === "view model row" && vm[1].content === "second row");
  check("deep: timestamp string and simpleText object both parse", vm[0].from === 65 && vm[1].from === 754);
  const classic = { actions: [{ x: { transcriptSegmentRenderer: { startMs: "2000", endMs: "4000", snippet: { runs: [{ text: "classic row" }] } } } }] };
  const cl = pbpYtParseTranscriptDeep(classic);
  check("deep: classic renderer rows also collected", cl.length === 1 && cl[0].content === "classic row" && cl[0].from === 2);
  assertEq(pbpYtParseTranscriptDeep({}).length, 0, "deep: empty object -> empty");
  assertEq(pbpYtParseTranscriptDeep(null).length, 0, "deep: null -> empty");
})();

section("pbpYtTranscriptParams");
(() => {
  const params = pbpYtTranscriptParams("b_OpjUz7zN8", "zh", false);
  const decoded = atob(params);
  assert(decoded.includes("b_OpjUz7zN8"), "outer protobuf carries the videoId in cleartext");
  assert(decoded.includes("engagement-panel-searchable-transcript-search-panel"), "outer protobuf carries the panel id");
  const innerTok = decodeURIComponent((decoded.match(/([A-Za-z0-9_\-]+%3D*|[A-Za-z0-9_\-=]+)/g) || []).find(t => { try { return atob(decodeURIComponent(t).replace(/-/g, "+").replace(/_/g, "/")).includes("zh"); } catch (_) { return false; } }) || "");
  assert(!!innerTok, "inner token decodes and carries the language code");
  const asrParams = atob(pbpYtTranscriptParams("dQw4w9WgXcQ", "en", true));
  const asrInner = (asrParams.match(/[A-Za-z0-9_\-]+%3D+/) || [""])[0];
  assert(asrInner ? atob(decodeURIComponent(asrInner).replace(/-/g, "+").replace(/_/g, "/")).includes("asr") : true, "asr flag lands in the inner token when set");
  assert(pbpYtTranscriptParams("x", "en", false) !== pbpYtTranscriptParams("x", "de", false), "language changes the token");
})();

section("punctuation enhancement");
(() => {
  const mk = (n, content, gapAfter) => ({ from: n * 3, to: n * 3 + (gapAfter != null ? 3 - gapAfter : 2.9), content });
  const unp = []; for (let i = 0; i < 12; i++) unp.push({ from: i * 3, to: i * 3 + 2.9, content: "这是没有标点的第" + i + "句" });
  assert(pbpVideoNeedsPunctuation(unp) === true, "needs: 12 unpunctuated CJK segments qualify");
  const punc = unp.map((s) => ({ ...s, content: s.content + "。" }));
  assert(pbpVideoNeedsPunctuation(punc) === false, "needs: punctuated track never qualifies");
  assert(pbpVideoNeedsPunctuation(unp.slice(0, 5)) === false, "needs: short tracks are left alone");
  const segs = [
    { from: 0, to: 2.8, content: "这是第一句" },      // 0.2s gap -> nothing
    { from: 3, to: 5, content: "然后短停顿" },        // 1.0s gap -> comma
    { from: 6, to: 8, content: "长停顿之前说的话" },   // 4s gap -> full stop
    { from: 12, to: 14, content: "你说对吗" },        // last + particle -> question mark
  ];
  const hp = pbpVideoHeuristicPunctuate(segs);
  assertEq(hp[0].content, "这是第一句", "heuristic: tiny gap gets no mark");
  assertEq(hp[1].content, "然后短停顿，", "heuristic: short pause gets a comma");
  assertEq(hp[2].content, "长停顿之前说的话。", "heuristic: long pause gets a full stop");
  assertEq(hp[3].content, "你说对吗？", "heuristic: trailing interrogative particle gets a question mark");
  assertEq(pbpVideoHeuristicPunctuate([{ from: 0, to: 9, content: "english asr line" }])[0].content, "english asr line", "heuristic: non-CJK untouched");
  assertEq(segs[1].content, "然后短停顿", "heuristic: input segments not mutated");
  assert(pbpVideoPunctConserved("我们蒸馒头 蒸饭", "我们蒸馒头，蒸饭。") === true, "conserved: pure punctuation insertion passes");
  assert(pbpVideoPunctConserved("我们蒸馒头", "我们蒸包子。") === false, "conserved: rewritten words fail closed");
  assert(pbpVideoPunctConserved("", "") === false, "conserved: empty input fails closed");
})();

section("pbpYtTabEligible");
assert(pbpYtTabEligible("https://www.youtube.com/watch?v=dQw4w9WgXcQ") === true, "watch page tab is eligible");
assert(pbpYtTabEligible("https://www.youtube.com/") === true, "any www.youtube.com page is eligible (same-origin fetch host)");
assert(pbpYtTabEligible("https://m.youtube.com/watch?v=dQw4w9WgXcQ") === false, "m.youtube.com is NOT eligible (grant covers www only)");
assert(pbpYtTabEligible("http://www.youtube.com/") === false, "plain http is not eligible");
assert(pbpYtTabEligible("https://youtu.be/dQw4w9WgXcQ") === false, "youtu.be is not eligible");
assert(pbpYtTabEligible("not a url") === false, "garbage is not eligible");

section("pbpVideoPosterUrl");
assertEq(pbpVideoPosterUrl(pbpVideoDetect("https://www.youtube.com/watch?v=dQw4w9WgXcQ")),
  "https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg", "youtube: deterministic hqdefault URL");
assertEq(pbpVideoPosterUrl(pbpVideoDetect("https://www.bilibili.com/video/BV1xx411c7mD")), "", "bilibili: no poster");
assertEq(pbpVideoPosterUrl(null), "", "null-safe: null input");
assertEq(pbpVideoPosterUrl(undefined), "", "null-safe: undefined input");

section("pbpYtWatchUrl + player-json lift");
assert(pbpYtWatchUrl("abc123", "zh-CN").startsWith("https://www.youtube.com/watch?v=abc123"), "watch url shape");
check("hl carried", pbpYtWatchUrl("abc123", "zh-CN").includes("hl=zh-CN"));
const HTML_OK = 'x<script>var ytInitialPlayerResponse = {"captions":{"playerCaptionsTracklistRenderer":{"captionTracks":[{"baseUrl":"https://www.youtube.com/api/timedtext?a=1","languageCode":"en","name":{"simpleText":"English"}}]}}};<\/script>y';
const lifted = pbpYtExtractPlayerJson(HTML_OK);
check("lifts captionTracks from watch html", pbpYtExtractPlayerJson(HTML_OK) && pbpYtExtractTracks(lifted).length === 1);
assertEq(pbpYtExtractPlayerJson("no player here"), null, "absent player json yields null");
assertEq(pbpYtExtractPlayerJson('var ytInitialPlayerResponse = {"broken":'), null, "malformed json yields null");

section("pbpYtExtractTracks + pick");
const PR = { captions: { playerCaptionsTracklistRenderer: { captionTracks: [
  { baseUrl: "https://www.youtube.com/api/timedtext?a=1", languageCode: "en", name: { simpleText: "English" } },
  { baseUrl: "https://www.youtube.com/api/timedtext?a=2", languageCode: "zh-Hans", name: { runs: [{ text: "中文（简体）" }] }, kind: "asr" },
  { baseUrl: "https://www.youtube.com/api/timedtext?a=3", languageCode: "ja", name: {} }
] } } };
const tracks = pbpYtExtractTracks(PR);
assertEq(tracks.length, 3, "three tracks");
check("labels: simpleText, runs, languageCode fallback",
  tracks[0].label === "English" && tracks[1].label === "中文（简体）" && tracks[2].label === "ja");
check("asr flag mapped", tracks[0].asr === false && tracks[1].asr === true);
assertEq(pbpYtExtractTracks({}).length, 0, "missing captions yields empty list");
assertEq(pbpYtPickTrack(tracks, "zh-CN").lang, "zh-Hans", "zh UI prefers zh track even when asr");
assertEq(pbpYtPickTrack(tracks, "fr").lang, "en", "no lang match falls to first non-asr");
assertEq(pbpYtPickTrack([], "en"), null, "empty list picks null");

section("timedtext parsers");
const XML = '<?xml version="1.0"?><transcript><text start="1.2" dur="2.3">Hello &amp;amp; welcome</text><text start="4.0" dur="1.0">第二句</text></transcript>';
const sx = pbpYtParseTimedtextXml(XML);
check("xml: two segments with times", sx.length === 2 && sx[0].from === 1.2 && sx[0].to === 3.5 && sx[1].from === 4);
assertEq(sx[0].content, "Hello & welcome", "xml entities decoded (double-encoded amp)");
const J3 = JSON.stringify({ events: [ { tStartMs: 0, dDurationMs: 1500, segs: [{ utf8: "one " }, { utf8: "two" }] }, { tStartMs: 2000, segs: [{ utf8: "\n" }] }, { tStartMs: 3000, dDurationMs: 800, segs: [{ utf8: "three" }] } ] });
const sj = pbpYtParseJson3(J3);
check("json3: newline-only event dropped", sj.length === 2 && sj[0].content === "one two" && sj[1].content === "three");
check("json3: ms converted to seconds", sj[0].from === 0 && sj[0].to === 1.5 && sj[1].from === 3);
assertEq(pbpYtParseJson3("not json").length, 0, "bad json3 yields empty");
assertEq(pbpYtParseTimedtextXml("<transcript></transcript>").length, 0, "empty xml yields empty");

section("merge + markdown + time");
const SEGS = [ { from: 0, to: 2, content: "Sentence one." }, { from: 2.1, to: 4, content: "and continues" }, { from: 10, to: 12, content: "After a gap" } ];
const paras = pbpVideoMergeParagraphs(SEGS);
// The 6s silence between "and continues" (ends 4s) and "After a gap" (starts
// 10s) is a paragraph boundary now -- the punctuation-only rule rendered
// bilibili's unpunctuated ASR tracks as one wall of text.
check("merge: sentence end breaks; a 6s silent gap breaks too", paras.length === 3 && paras[0] === "Sentence one." && paras[1] === "and continues" && paras[2] === "After a gap");
const CJK = []; for (let i = 0; i < 30; i++) CJK.push({ from: i, to: i + 0.9, content: "十个字十个字十个字十" });
const cjkParas = pbpVideoMergeParagraphs(CJK);
check("merge: unpunctuated gapless run breaks on the length ceiling", cjkParas.length > 1 && cjkParas.every(p => p.replace(/ /g, "").length <= 220));
check("merge: nothing lost across ceiling breaks", cjkParas.join("").replace(/ /g, "").length === 300);
const md = pbpVideoTranscriptMarkdown(SEGS, { title: "T", url: "https://youtu.be/x", trackLabel: "English" });
check("markdown: heading + source line + paragraphs", md.startsWith("## ") && md.includes("https://youtu.be/x") && md.includes("English") && md.includes("Sentence one."));
assertEq(pbpVideoFmtTime(65), "1:05", "m:ss");
assertEq(pbpVideoFmtTime(3671), "1:01:11", "h:mm:ss");

section("pbpYtFetchTranscript over the watch page");
await (async () => {
  let sawCreds = null, sawUrl = null;
  const fetchFn = async (url, o) => {
    sawUrl = url; sawCreds = o && o.credentials;
    if (url.includes("/watch")) return { ok: true, text: async () => HTML_OK };
    return { ok: true, text: async () => JSON.stringify({ events: [{ tStartMs: 0, dDurationMs: 900, segs: [{ utf8: "hi" }] }] }) };
  };
  const res = await pbpYtFetchTranscript("vid", { fetchFn, uiLang: "en" });
  check("segments delivered from the scrape path", res.segments && res.segments[0].content === "hi");
  check("watch page fetched", /\/watch\?v=vid/.test(sawUrl) || sawUrl.includes("timedtext") );
  assertEq(sawCreds, "omit", "default stays cookieless");
  let creds2 = null;
  await pbpYtFetchTranscript("vid", { fetchFn: async (u, o) => { creds2 = o && o.credentials; return { ok: true, text: async () => HTML_OK }; }, useLogin: true });
  assertEq(creds2, "include", "useLogin opts into the login-cookie fetch");
  const empty = await pbpYtFetchTranscript("vid", { fetchFn: async (u) => u.includes("/watch") ? { ok: true, text: async () => HTML_OK } : { ok: true, text: async () => "" } });
  assertEq(empty.error, "caption-body", "empty timedtext body (exp=xpe) reports caption-body");
  const noHtml = await pbpYtFetchTranscript("vid", { fetchFn: async () => ({ ok: false, status: 429 }) });
  assertEq(noHtml.error, "player", "watch page failure keeps the player error code");
})();

section("pbpVideoDetect: bilibili");
assertEq(pbpVideoDetect("https://www.bilibili.com/video/BV1xx411c7mD").bvid, "BV1xx411c7mD", "bvid from /video/");
assertEq(pbpVideoDetect("https://www.bilibili.com/video/BV1xx411c7mD?p=3&t=1").part, 3, "?p= part");
assertEq(pbpVideoDetect("https://www.bilibili.com/video/BV1xx411c7mD").part, 1, "default part 1");
assertEq(pbpVideoDetect("https://www.bilibili.com/video/BV1xx411c7mD").provider, "bilibili", "provider tag");
assertEq(pbpVideoDetect("https://m.bilibili.com/video/BV1xx411c7mD").bvid, "BV1xx411c7mD", "mobile host");
assertEq(pbpVideoDetect("https://www.bilibili.com/festival/x?bvid=BV1xx411c7mD").bvid, "BV1xx411c7mD", "festival page bvid param");
assertEq(pbpVideoDetect("https://www.bilibili.com/"), null, "non-video bilibili page null");
assertEq(pbpVideoDetect("https://www.youtube.com/watch?v=dQw4w9WgXcQ").provider, "youtube", "youtube still detected");

section("pbpMd5");
assertEq(pbpMd5(""), "d41d8cd98f00b204e9800998ecf8427e", "md5 empty");
assertEq(pbpMd5("abc"), "900150983cd24fb0d6963f7d28e17f72", "md5 abc");
assertEq(pbpMd5("The quick brown fox jumps over the lazy dog"), "9e107d9d372bb6826bd81d3542a419d6", "md5 pangram");

section("WBI signing");
assertEq(PBP_BILI_MIXIN_TAB.length, 64, "mixin table has 64 entries");
const navJson = { data: { wbi_img: { img_url: "https://i0.hdslb.com/bfs/wbi/7cd084941338484aae1ad9425b84077c.png", sub_url: "https://i0.hdslb.com/bfs/wbi/4932caff0ff746eab6f01bf08b70ac45.png" } } };
const mk = pbpBiliMixinKey(navJson);
assertEq(mk.length, 32, "mixin key is 32 chars");
check("mixin key is deterministic", pbpBiliMixinKey(navJson) === mk);
assertEq(pbpBiliMixinKey({}), "", "missing wbi_img yields empty key");
const signed = pbpBiliSign({ bvid: "BV1x", cid: "123" }, mk);
check("sign adds wts and w_rid", typeof signed.wts === "number" && /^[0-9a-f]{32}$/.test(signed.w_rid));
check("w_rid = md5(sorted-encoded-params + mixinKey)", (function () {
  const q = Object.keys({ bvid: "BV1x", cid: "123", wts: signed.wts }).sort()
    .map((k) => encodeURIComponent(k) + "=" + encodeURIComponent({ bvid: "BV1x", cid: "123", wts: signed.wts }[k])).join("&");
  return signed.w_rid === pbpMd5(q + mk);
})());

section("cid + subtitle parse + pick");
const viewJson = { data: { cid: 555, title: "T", pic: "//i.hdslb.com/x.jpg", owner: { name: "UP" }, pages: [ { cid: 555, part: "P1", page: 1 }, { cid: 666, part: "P2", page: 2 } ] } };
assertEq(pbpBiliExtractCid(viewJson, 1).cid, 555, "part 1 cid");
assertEq(pbpBiliExtractCid(viewJson, 2).cid, 666, "part 2 cid from pages[]");
assertEq(pbpBiliExtractCid(viewJson, 9).cid, 555, "out-of-range part falls to top-level cid");
assertEq(pbpBiliExtractCid({}, 1), null, "no data yields null");
const subs = [ { lan: "ai-zh", lan_doc: "中文(AI)", subtitle_url: "//x/ai.json" }, { lan: "zh-CN", lan_doc: "中文", subtitle_url: "//x/human.json" }, { lan: "en", lan_doc: "English", subtitle_url: "//x/en.json" } ];
assertEq(pbpBiliPickSubtitle(subs).lan, "zh-CN", "human zh beats ai-zh");
assertEq(pbpBiliPickSubtitle([subs[0], subs[2]]).lan, "ai-zh", "ai-zh when no human zh");
assertEq(pbpBiliPickSubtitle([]), null, "empty subs null");
const subJson = { body: [ { from: 1.2, to: 3.5, content: "第一句" }, { from: 3.5, to: 5, content: "第二句" } ] };
const segs = pbpBiliParseSubtitleJson(subJson);
check("subtitle json body -> segments", segs.length === 2 && segs[0].from === 1.2 && segs[0].to === 3.5 && segs[1].content === "第二句");
assertEq(pbpBiliParseSubtitleJson({}).length, 0, "no body yields empty");

section("pbpBiliFetchTranscript orchestration");
await (async () => {
  const nav = navJson, view = viewJson;
  const fetchFn = async (url) => {
    if (url.includes("/x/web-interface/nav")) return { ok: true, json: async () => nav };
    if (url.includes("/x/web-interface/view")) return { ok: true, json: async () => view };
    if (url.includes("/x/player/wbi/v2")) return { ok: true, json: async () => ({ data: { subtitle: { subtitles: subs } } }) };
    if (url.includes("human.json")) return { ok: true, json: async () => subJson };
    return { ok: true, json: async () => ({}) };
  };
  const res = await pbpBiliFetchTranscript("BV1x", 1, { fetchFn });
  check("segments delivered", res.segments && res.segments.length === 2);
  check("picked human zh track", res.track && res.track.lan === "zh-CN");
  check("tracks + meta delivered", res.tracks.length === 3 && res.meta && res.meta.title === "T");
  const loggedOut = await pbpBiliFetchTranscript("BV1x", 1, { fetchFn: async (url) => {
    if (url.includes("/x/web-interface/nav")) return { ok: true, json: async () => nav };
    if (url.includes("/x/web-interface/view")) return { ok: true, json: async () => view };
    if (url.includes("/x/player/wbi/v2")) return { ok: true, json: async () => ({ data: { subtitle: { subtitles: [] } } }) };
    return { ok: true, json: async () => ({}) };
  } });
  check("empty subtitle list -> error:'login'", loggedOut.error === "login");
})();

document.getElementById("summary").textContent = `${pass} passed, ${fail} failed`;
})();
</script>
</body></html>
