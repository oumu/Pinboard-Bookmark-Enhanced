<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Vocabulary Google Drive Tests</title>
<style>
body { font-family: monospace; padding: 16px; max-width: 1000px; }
.case { padding: 6px; border-bottom: 1px solid #eee; white-space: pre-wrap; }
.pass { color: #0a0; } .fail { color: #c00; font-weight: bold; }
</style></head><body>
<h1>Vocabulary Google Drive Tests</h1><div id="summary"></div><div id="results"></div>
<script src="../vocab-store.js"></script>
<script src="../vocab-gdrive.js"></script>
<script>
const root = document.getElementById("results");
const TEST_MAX_BYTES = 4 * 1024 * 1024;
const OWNER_HASH = "a".repeat(64);
const OTHER_OWNER_HASH = "b".repeat(64);
const DEVICE_ID = "device-a";
const DRIVE_FILE_ID = "file:opaque+id";
const ENVELOPE = { ownerHash: OWNER_HASH, deviceId: DEVICE_ID, createdAt: 123 };
let pass = 0, fail = 0;
function check(name, cond, detail) {
  const ok = !!cond; ok ? pass++ : fail++;
  const row = document.createElement("div");
  row.className = "case " + (ok ? "pass" : "fail");
  row.textContent = `${ok ? "✓" : "✗"} ${name}${ok ? "" : "\n   " + (detail || "")}`;
  root.appendChild(row);
}
function attempt(fn) { try { return fn(); } catch (_) { return false; } }
function throws(fn) { try { fn(); return false; } catch (_) { return true; } }
function bytes(value) { return new TextEncoder().encode(value).length; }
function live(term = "Word", language = "en", patch = {}, deviceId = DEVICE_ID) {
  const recordKey = pbpDictPrimaryLang(language) + "|" + pbpDictNormalizeTerm(term).toLowerCase();
  return {
    recordKey, vector: { [deviceId]: 1 }, dot: { deviceId, counter: 1 }, deleted: false,
    value: {
      term, lemma: term.toLowerCase(), language, gloss: "gloss", ipa: null,
      sourceUrl: "https://example.test/word", license: "CC0", contexts: [], groups: [],
      note: "", status: "new", createdAt: 10, updatedAt: 20, ...patch
    }
  };
}
function tombstone(term = "Gone") {
  const entry = live(term);
  return { recordKey: entry.recordKey, vector: entry.vector, dot: entry.dot, deleted: true };
}
function bodyObject(entries, envelope = ENVELOPE) {
  return {
    schema: 1, ownerHash: envelope.ownerHash, deviceId: envelope.deviceId,
    createdAt: envelope.createdAt, entries
  };
}
function bodyString(entries, envelope = ENVELOPE) {
  return JSON.stringify(bodyObject(entries, envelope));
}
function sizedEntry(targetBodyBytes, term) {
  const entry = live(term);
  const padding = targetBodyBytes - bytes(bodyString([entry]));
  if (padding < 0) throw new Error("target body is too small");
  entry.value.note = "x".repeat(padding);
  return entry;
}
function metadata(ownerHash = OWNER_HASH, deviceId = DEVICE_ID) {
  return pbpVocabDriveMetadata(DRIVE_FILE_ID, ownerHash, deviceId);
}
function splitBodiesValidate(result, envelope = ENVELOPE) {
  return result.ok && result.batches.every((batch) =>
    pbpVocabValidateDriveBatch(metadata(envelope.ownerHash, envelope.deviceId), batch.body, envelope.ownerHash));
}
async function asyncCheck(name, fn) {
  try { check(name, await fn()); } catch (error) { check(name, false, error && error.message); }
}
function identityFixture(tokens = ["token-a"]) {
  let index = 0;
  const calls = [];
  const removed = [];
  return {
    calls,
    removed,
    async getAuthToken(options) {
      calls.push({ ...options });
      const value = tokens[Math.min(index++, tokens.length - 1)];
      if (value instanceof Error) throw value;
      return { token: value };
    },
    async removeCachedAuthToken(details) { removed.push(details.token); }
  };
}
function jsonResponse(value, status = 200, headers) {
  return new Response(JSON.stringify(value), {
    status,
    headers: { "Content-Type": "application/json", ...headers }
  });
}
function readerResponse(chunks, onCancel, headers = {}) {
  let index = 0;
  return {
    ok: true,
    status: 200,
    headers: new Headers(headers),
    body: {
      getReader() {
        return {
          async read() {
            return index < chunks.length
              ? { done: false, value: chunks[index++] }
              : { done: true, value: undefined };
          },
          async cancel() { if (onCancel) onCancel(); }
        };
      }
    }
  };
}

(async () => {
  let ownerHash = null;
  try { ownerHash = await pbpVocabOwnerHash("abc"); } catch (_) {}
  check("SHA-256 owner hash", ownerHash === "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad");
  check("owner hash is 64 lowercase hex", attempt(() => /^[0-9a-f]{64}$/.test(ownerHash) && ownerHash.length === 64));

  check("metadata fixes Drive batch fields", attempt(() => {
    const meta = metadata();
    const entry = live();
    const body = bodyString([entry]);
    const exact = JSON.stringify(meta) === JSON.stringify({
      id: DRIVE_FILE_ID, name: `pbp-vocab-${DRIVE_FILE_ID}.json`,
      parents: ["appDataFolder"], mimeType: "application/json",
      appProperties: { pbpKind: "vocab-batch", schema: "1", owner: OWNER_HASH, device: DEVICE_ID }
    });
    const missingId = { ...meta };
    delete missingId.id;
    const wrongKind = { ...meta, appProperties: { ...meta.appProperties, pbpKind: "other" } };
    const wrongSchema = { ...meta, appProperties: { ...meta.appProperties, schema: "2" } };
    return exact && pbpVocabValidateDriveBatch(meta, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(missingId, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch({ ...meta, id: "other:id" }, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch({ ...meta, name: "pbp-vocab-other.json" }, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch({ ...meta, mimeType: "text/plain" }, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(wrongKind, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(wrongSchema, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch({ ...meta, modifiedTime: "unexpected" }, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch({ ...meta, parents: ["root"] }, body, OWNER_HASH);
  }));

  check("appProperties contain no username email or token", attempt(() => {
    const meta = metadata();
    const body = bodyString([live()]);
    const serialized = JSON.stringify(meta);
    const leaked = { ...meta, appProperties: { ...meta.appProperties, email: "alice@example.com" } };
    const token = { ...meta, appProperties: { ...meta.appProperties, token: "secret-token" } };
    return !serialized.includes("alice@example.com") && !serialized.includes("secret-token") &&
      !pbpVocabValidateDriveBatch(leaked, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(token, body, OWNER_HASH);
  }));

  check("body uses canonical schema and stable construction", attempt(() => {
    const entry = live();
    const split = pbpVocabSplitDriveEntries([entry], ENVELOPE);
    const exact = JSON.stringify({
      schema: 1, ownerHash: OWNER_HASH, deviceId: DEVICE_ID, createdAt: 123, entries: [entry]
    });
    const extra = JSON.stringify({ ...bodyObject([entry]), cursor: "secret" });
    return splitBodiesValidate(split) && split.batches[0].body === exact &&
      !pbpVocabValidateDriveBatch(metadata(), "{bad json", OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(metadata(), extra, OWNER_HASH);
  }));

  check("deleted entry has no value", attempt(() => {
    const entry = tombstone();
    const withValue = { ...entry, value: live().value };
    return pbpVocabValidateDriveBatch(metadata(), bodyString([entry]), OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(metadata(), bodyString([withValue]), OWNER_HASH);
  }));

  check("live entry requires value", attempt(() => {
    const entry = live();
    delete entry.value;
    return !pbpVocabValidateDriveBatch(metadata(), bodyString([entry]), OWNER_HASH);
  }));

  check("entry is owner-free", attempt(() => {
    const entry = live();
    const body = bodyString([entry]);
    const ownerField = { ...entry, owner: "acct_alice" };
    const tokenField = { ...entry, token: "secret-token" };
    const valueOwner = { ...entry, value: { ...entry.value, owner: "acct_alice" } };
    const sparseGroups = live("Sparse Groups");
    const sparseContexts = live("Sparse Contexts");
    sparseGroups.value.groups = new Array(1);
    sparseContexts.value.contexts = new Array(1);
    return !body.includes("acct_alice") &&
      !pbpVocabValidateDriveBatch(metadata(), bodyString([ownerField]), OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(metadata(), bodyString([tokenField]), OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(metadata(), bodyString([valueOwner]), OWNER_HASH) &&
      !pbpVocabSplitDriveEntries([sparseGroups], ENVELOPE).ok &&
      !pbpVocabSplitDriveEntries([sparseContexts], ENVELOPE).ok;
  }));

  check("UTF-8 byte count is exact for multibyte data", attempt(() => {
    const split = pbpVocabSplitDriveEntries([live("Défense", "fr", { gloss: "é中🙂" })], ENVELOPE);
    return splitBodiesValidate(split) && split.batches[0].bytes === bytes(split.batches[0].body) &&
      split.batches[0].bytes > split.batches[0].body.length;
  }));

  check("at-or-under 4 MiB boundary is accepted", attempt(() => {
    const split = pbpVocabSplitDriveEntries([sizedEntry(TEST_MAX_BYTES, "Limit")], ENVELOPE);
    return splitBodiesValidate(split) && split.batches.length === 1 &&
      split.batches[0].bytes === TEST_MAX_BYTES &&
      split.batches[0].bytes === PBP_VOCAB_BATCH_MAX_BYTES;
  }));

  check("entries split across batches in order", attempt(() => {
    const entries = ["First", "Second", "Third"].map((term) => {
      const entry = live(term);
      entry.value.note = "x".repeat(Math.floor(TEST_MAX_BYTES / 2) + 100);
      return entry;
    });
    const split = pbpVocabSplitDriveEntries(entries, ENVELOPE);
    const empty = pbpVocabSplitDriveEntries([], ENVELOPE);
    const keys = split.batches.flatMap((batch) => JSON.parse(batch.body).entries.map((entry) => entry.recordKey));
    return splitBodiesValidate(split) && empty.ok && empty.batches.length === 0 &&
      split.batches.length > 1 &&
      keys.join(",") === entries.map((entry) => entry.recordKey).join(",") &&
      split.batches.every((batch) => batch.bytes <= TEST_MAX_BYTES);
  }));

  check("a single entry is never split", attempt(() => {
    const entry = sizedEntry(TEST_MAX_BYTES - 1, "Whole");
    const split = pbpVocabSplitDriveEntries([entry], ENVELOPE);
    const stored = JSON.parse(split.batches[0].body).entries;
    return splitBodiesValidate(split) && split.batches.length === 1 && stored.length === 1 &&
      JSON.stringify(stored[0]) === JSON.stringify(entry);
  }));

  check("oversized entry is a permanent entry_too_large result", attempt(() => {
    const entry = sizedEntry(TEST_MAX_BYTES + 1, "Oversized");
    const result = pbpVocabSplitDriveEntries([entry], ENVELOPE);
    return JSON.stringify(result) === JSON.stringify({
      ok: false, error: "entry_too_large", recordKey: entry.recordKey, bytes: TEST_MAX_BYTES + 1
    });
  }));

  check("invalid noncanonical recordKey rejects the batch", attempt(() => {
    const entry = live();
    entry.recordKey = "EN|Word";
    return !pbpVocabValidateDriveBatch(metadata(), bodyString([entry]), OWNER_HASH);
  }));

  check("ownerHash mismatch rejects the whole batch", attempt(() => {
    const body = bodyString([live()]);
    const uppercase = OWNER_HASH.toUpperCase();
    const uppercaseMeta = metadata();
    uppercaseMeta.appProperties.owner = uppercase;
    return !pbpVocabValidateDriveBatch(metadata(), body, OTHER_OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(uppercaseMeta, bodyString([live()], { ...ENVELOPE, ownerHash: uppercase }), uppercase) &&
      !pbpVocabValidateDriveBatch(metadata(), body, "not-a-hash");
  }));

  check("metadata and body device mismatch rejects", attempt(() => {
    const mismatch = bodyString([live("Word", "en", {}, "device-b")], { ...ENVELOPE, deviceId: "device-b" });
    const nonNfcDevice = "e\u0301";
    const longDevice = "界".repeat(40);
    const invalidBody = bodyString([live("Word", "en", {}, nonNfcDevice)], { ...ENVELOPE, deviceId: nonNfcDevice });
    const longBody = bodyString([live("Word", "en", {}, longDevice)], { ...ENVELOPE, deviceId: longDevice });
    const nonNfcMetadata = metadata();
    const emptyMetadata = metadata();
    const longMetadata = metadata();
    nonNfcMetadata.appProperties.device = nonNfcDevice;
    emptyMetadata.appProperties.device = "";
    longMetadata.appProperties.device = longDevice;
    return !pbpVocabValidateDriveBatch(metadata(), mismatch, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(nonNfcMetadata, invalidBody, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(emptyMetadata, bodyString([live()], { ...ENVELOPE, deviceId: "" }), OWNER_HASH) &&
      throws(() => pbpVocabDriveMetadata(DRIVE_FILE_ID, OWNER_HASH, longDevice)) &&
      !pbpVocabValidateDriveBatch(longMetadata, longBody, OWNER_HASH) &&
      !pbpVocabSplitDriveEntries([live()], { ...ENVELOPE, deviceId: longDevice }).ok;
  }));

  check("multipart contains metadata and exact frozen JSON body", attempt(() => {
    const meta = metadata();
    const frozen = bodyString([live("Multipart", "en", { note: "pbp-vocab-boundary" })]);
    const multipart = pbpVocabBuildMultipart(meta, frozen);
    const boundary = multipart.contentType.match(/^multipart\/related; boundary=(.+)$/)[1];
    const metadataJson = JSON.stringify(meta);
    return metadataJson.includes(`"id":"${DRIVE_FILE_ID}"`) &&
      boundary.length === 40 && boundary.length <= 70 && /^pbp-[0-9a-f-]{36}$/i.test(boundary) &&
      !metadataJson.includes(boundary) && !frozen.includes(boundary) &&
      multipart.body.includes("\r\n\r\n" + metadataJson + "\r\n--" + boundary) &&
      multipart.body.includes("\r\n\r\n" + frozen + "\r\n--" + boundary + "--") &&
      multipart.body.indexOf(frozen) === multipart.body.lastIndexOf(frozen);
  }));

  await asyncCheck("Drive auth is noninteractive by default", async () => {
    const identity = identityFixture();
    const client = pbpCreateVocabDriveClient({
      identity,
      fetchImpl: async () => jsonResponse({ user: { permissionId: "perm-a" } })
    });
    const result = await client.about();
    return result.ok && identity.calls.length === 1 && identity.calls[0].interactive === false;
  });

  await asyncCheck("interactive auth is confined to explicit connect", async () => {
    const identity = identityFixture(["connect-token", "background-token"]);
    const client = pbpCreateVocabDriveClient({
      identity,
      fetchImpl: async (url) => String(url).includes("generateIds")
        ? jsonResponse({ ids: ["generated-id"] })
        : jsonResponse({ user: { permissionId: "perm-a" } })
    });
    const connected = await client.connect();
    const generated = await client.generateId();
    return connected.ok && generated.ok && identity.calls.length === 2 &&
      identity.calls[0].interactive === true && identity.calls[1].interactive === false;
  });

  await asyncCheck("about.get requests exact minimal fields", async () => {
    const calls = [];
    const client = pbpCreateVocabDriveClient({
      identity: identityFixture(),
      fetchImpl: async (url, init) => {
        calls.push({ url: String(url), init });
        return jsonResponse({ user: {
          permissionId: "perm-a", emailAddress: "a@example.test", displayName: "A"
        } });
      }
    });
    const result = await client.about();
    const url = new URL(calls[0].url);
    return result.ok && result.permissionId === "perm-a" &&
      url.origin === "https://www.googleapis.com" && url.pathname === "/drive/v3/about" &&
      url.searchParams.toString() ===
        "fields=user%28permissionId%2CemailAddress%2CdisplayName%29" &&
      calls[0].init.method === "GET";
  });

  await asyncCheck("about.get fails closed without permissionId", async () => {
    const client = pbpCreateVocabDriveClient({
      identity: identityFixture(),
      fetchImpl: async () => jsonResponse({ user: { emailAddress: "a@example.test" } })
    });
    const result = await client.about();
    return !result.ok && result.error === "invalid_response" && result.retryable === false;
  });

  await asyncCheck("first 401 evicts token and retries exactly once", async () => {
    const identity = identityFixture(["old-token", "new-token"]);
    let fetches = 0;
    const client = pbpCreateVocabDriveClient({
      identity,
      fetchImpl: async () => ++fetches === 1
        ? new Response(null, { status: 401 })
        : jsonResponse({ user: { permissionId: "perm-a" } })
    });
    const result = await client.about();
    return result.ok && fetches === 2 && identity.calls.length === 2 &&
      identity.calls.every((call) => call.interactive === false) &&
      identity.removed.length === 1 && identity.removed[0] === "old-token";
  });

  await asyncCheck("second 401 stops without a third request", async () => {
    const identity = identityFixture(["old-token", "new-token"]);
    let fetches = 0;
    const client = pbpCreateVocabDriveClient({
      identity,
      fetchImpl: async () => {
        fetches++;
        return new Response(null, { status: 401 });
      }
    });
    const result = await client.about();
    return !result.ok && result.error === "auth" && result.status === 401 &&
      result.retryable === false && fetches === 2 && identity.calls.length === 2 &&
      identity.removed.length === 1;
  });

  await asyncCheck("403/404 are permanent and oversized headers fail before reading", async () => {
    const permanent = [];
    for (const status of [403, 404]) {
      const client = pbpCreateVocabDriveClient({
        identity: identityFixture(),
        fetchImpl: async () => new Response("private-response-body", { status })
      });
      permanent.push(await client.about());
    }
    let read = false;
    let cancelled = false;
    const oversized = pbpCreateVocabDriveClient({
      identity: identityFixture(),
      fetchImpl: async () => ({
        ok: true,
        status: 200,
        headers: new Headers({ "Content-Length": String(TEST_MAX_BYTES + 1) }),
        body: {
          cancel() { cancelled = true; },
          getReader() { read = true; throw new Error("must not read"); }
        }
      })
    });
    const download = await oversized.download(DRIVE_FILE_ID);
    return permanent.every((result) => !result.ok && result.retryable === false) &&
      !download.ok && download.error === "remote_batch_too_large" && !read && cancelled;
  });

  await asyncCheck("429 is retryable and streamed overflow cancels", async () => {
    const rateLimited = pbpCreateVocabDriveClient({
      identity: identityFixture(),
      fetchImpl: async () => new Response("private-response-body", { status: 429 })
    });
    const rateResult = await rateLimited.about();
    let cancelled = false;
    const overflow = pbpCreateVocabDriveClient({
      identity: identityFixture(),
      fetchImpl: async () => readerResponse(
        [new Uint8Array(TEST_MAX_BYTES), new Uint8Array(1)],
        () => { cancelled = true; throw new Error("cancel failed"); }
      )
    });
    const download = await overflow.download(DRIVE_FILE_ID);
    return !rateResult.ok && rateResult.error === "rate_limited" && rateResult.retryable === true &&
      !download.ok && download.error === "remote_batch_too_large" && cancelled;
  });

  await asyncCheck("5xx is retryable and absent Content-Length can succeed", async () => {
    const serverError = pbpCreateVocabDriveClient({
      identity: identityFixture(),
      fetchImpl: async () => new Response("private-response-body", { status: 503 })
    });
    const errorResult = await serverError.about();
    const downloadClient = pbpCreateVocabDriveClient({
      identity: identityFixture(),
      fetchImpl: async () => readerResponse([new TextEncoder().encode("é-small")])
    });
    const download = await downloadClient.download(DRIVE_FILE_ID);
    let invalidCancelled = false;
    const invalidUtf8 = pbpCreateVocabDriveClient({
      identity: identityFixture(),
      fetchImpl: async () => readerResponse(
        [new Uint8Array([0xc3, 0x28])],
        () => { invalidCancelled = true; }
      )
    });
    const invalid = await invalidUtf8.download(DRIVE_FILE_ID);
    return !errorResult.ok && errorResult.error === "server" && errorResult.retryable === true &&
      download.ok && download.body === "é-small" &&
      !invalid.ok && invalid.error === "invalid_response" && invalid.retryable === false &&
      invalidCancelled;
  });

  await asyncCheck("network failure is retryable and exact 4 MiB succeeds", async () => {
    const network = pbpCreateVocabDriveClient({
      identity: identityFixture(),
      fetchImpl: async () => { throw new Error("socket private body"); }
    });
    const errorResult = await network.about();
    const exact = pbpCreateVocabDriveClient({
      identity: identityFixture(),
      fetchImpl: async () => readerResponse([new Uint8Array(TEST_MAX_BYTES).fill(97)])
    });
    const download = await exact.download(DRIVE_FILE_ID);
    let readerCancelled = false;
    const readerFailure = pbpCreateVocabDriveClient({
      identity: identityFixture(),
      fetchImpl: async () => ({
        ok: true,
        status: 200,
        headers: new Headers(),
        body: {
          getReader() {
            return {
              async read() { throw new Error("private reader message"); },
              async cancel() { readerCancelled = true; }
            };
          }
        }
      })
    });
    const readerResult = await readerFailure.download(DRIVE_FILE_ID);
    return !errorResult.ok && errorResult.error === "network" && errorResult.retryable === true &&
      download.ok && bytes(download.body) === TEST_MAX_BYTES &&
      !readerResult.ok && readerResult.error === "network" && readerResult.retryable === true &&
      readerCancelled && !JSON.stringify(readerResult).includes("private reader message");
  });

  await asyncCheck("generateIds uses exact one-ID appDataFolder query", async () => {
    const calls = [];
    const opaqueId = "opaque/+? id";
    const client = pbpCreateVocabDriveClient({
      identity: identityFixture(),
      fetchImpl: async (url, init) => {
        calls.push({ url: String(url), init });
        return jsonResponse({ ids: [opaqueId] });
      }
    });
    const result = await client.generateId();
    const url = new URL(calls[0].url);
    return result.ok && result.fileId === opaqueId &&
      url.pathname === "/drive/v3/files/generateIds" &&
      url.searchParams.toString() === "count=1&space=appDataFolder" &&
      calls[0].init.method === "GET";
  });

  await asyncCheck("multipart upload keeps pre-generated ID and exact body", async () => {
    const calls = [];
    const meta = metadata();
    const frozen = bodyString([live("Frozen", "en", { note: "exact-frozen-body" })]);
    const client = pbpCreateVocabDriveClient({
      identity: identityFixture(),
      fetchImpl: async (url, init) => {
        calls.push({ url: String(url), init });
        return jsonResponse({ id: DRIVE_FILE_ID }, 201);
      }
    });
    const result = await client.upload(meta, frozen);
    const call = calls[0];
    const url = new URL(call.url);
    return result.ok && result.fileId === DRIVE_FILE_ID && call.init.method === "POST" &&
      url.pathname === "/upload/drive/v3/files" &&
      url.searchParams.toString() === "uploadType=multipart" &&
      call.init.body.includes(JSON.stringify(meta)) &&
      call.init.body.includes(frozen) &&
      call.init.body.indexOf(frozen) === call.init.body.lastIndexOf(frozen) &&
      call.init.headers["Content-Type"].startsWith("multipart/related; boundary=");
  });

  await asyncCheck("multipart upload accepts 200 and 201", async () => {
    const meta = metadata();
    const frozen = bodyString([live("Statuses")]);
    const results = [];
    for (const status of [200, 201]) {
      const client = pbpCreateVocabDriveClient({
        identity: identityFixture(),
        fetchImpl: async () => jsonResponse({ id: DRIVE_FILE_ID }, status)
      });
      results.push(await client.upload(meta, frozen));
    }
    return results.every((result) => result.ok && result.fileId === DRIVE_FILE_ID);
  });

  await asyncCheck("409 exact metadata match is idempotent success", async () => {
    const meta = metadata();
    const calls = [];
    const client = pbpCreateVocabDriveClient({
      identity: identityFixture(["upload-token", "metadata-token"]),
      fetchImpl: async (url, init) => {
        calls.push({ url: String(url), init });
        return calls.length === 1
          ? new Response(null, { status: 409 })
          : jsonResponse(meta);
      }
    });
    const result = await client.upload(meta, bodyString([live("Retry")]));
    let networkFetches = 0;
    const networkClient = pbpCreateVocabDriveClient({
      identity: identityFixture(["upload-token", "metadata-token"]),
      fetchImpl: async () => {
        if (++networkFetches === 1) return new Response(null, { status: 409 });
        throw new Error("metadata network secret");
      }
    });
    const network = await networkClient.upload(meta, bodyString([live("Network Retry")]));
    const metadataUrl = new URL(calls[1].url);
    return result.ok && result.idempotent === true && result.fileId === DRIVE_FILE_ID &&
      calls.length === 2 && calls[1].init.method === "GET" &&
      metadataUrl.pathname === `/drive/v3/files/${encodeURIComponent(DRIVE_FILE_ID)}` &&
      metadataUrl.searchParams.get("fields") === "id,name,appProperties,parents,mimeType" &&
      !network.ok && network.error === "network" && network.retryable === true;
  });

  await asyncCheck("409 metadata mismatch is hard id_collision", async () => {
    const expected = metadata();
    const mismatch = { ...expected, appProperties: { ...expected.appProperties, device: "device-b" } };
    let fetches = 0;
    const client = pbpCreateVocabDriveClient({
      identity: identityFixture(["upload-token", "metadata-token"]),
      fetchImpl: async () => ++fetches === 1
        ? new Response(null, { status: 409 })
        : jsonResponse(mismatch)
    });
    const result = await client.upload(expected, bodyString([live("Collision")]));
    let serverFetches = 0;
    const serverClient = pbpCreateVocabDriveClient({
      identity: identityFixture(["upload-token", "metadata-token"]),
      fetchImpl: async () => ++serverFetches === 1
        ? new Response(null, { status: 409 })
        : new Response("private metadata body", { status: 503 })
    });
    const server = await serverClient.upload(expected, bodyString([live("Server Retry")]));
    return !result.ok && result.error === "id_collision" && result.status === 409 &&
      result.retryable === false && result.fileId === DRIVE_FILE_ID.slice(0, 8) &&
      !server.ok && server.error === "server" && server.status === 503 &&
      server.retryable === true;
  });

  await asyncCheck("files.list carries filters, minimal fields and page tokens", async () => {
    const calls = [];
    const nextToken = "next/+? &=token";
    const client = pbpCreateVocabDriveClient({
      identity: identityFixture(["page-a", "page-b"]),
      fetchImpl: async (url) => {
        calls.push(String(url));
        return calls.length === 1
          ? jsonResponse({ files: [{ id: "batch-a" }], nextPageToken: nextToken })
          : jsonResponse({ files: [{ id: "batch-b" }] });
      }
    });
    const first = await client.listFiles(OWNER_HASH);
    const second = await client.listFiles(OWNER_HASH, first.nextPageToken);
    const listResult = async (payload) => pbpCreateVocabDriveClient({
      identity: identityFixture(),
      fetchImpl: async () => jsonResponse(payload)
    }).listFiles(OWNER_HASH);
    const empty = await listResult({});
    const malformed = await Promise.all([
      listResult({ files: null }),
      listResult({ files: 0 }),
      listResult({ files: {} }),
      listResult({ files: [], nextPageToken: "" }),
      listResult({ files: [], nextPageToken: 0 })
    ]);
    const firstUrl = new URL(calls[0]);
    const secondUrl = new URL(calls[1]);
    const query = firstUrl.searchParams.get("q");
    return first.ok && second.ok && first.nextPageToken === nextToken &&
      firstUrl.pathname === "/drive/v3/files" &&
      firstUrl.searchParams.get("spaces") === "appDataFolder" &&
      firstUrl.searchParams.get("fields") ===
        "nextPageToken,files(id,name,appProperties,parents,mimeType)" &&
      query.includes("'appDataFolder' in parents") && query.includes("trashed = false") &&
      query.includes("key='pbpKind' and value='vocab-batch'") &&
      query.includes("key='schema' and value='1'") &&
      query.includes(`key='owner' and value='${OWNER_HASH}'`) &&
      secondUrl.searchParams.get("pageToken") === nextToken &&
      empty.ok && empty.files.length === 0 && empty.nextPageToken === null &&
      malformed.every((result) => !result.ok && result.error === "invalid_response");
  });

  await asyncCheck("changes APIs preserve next/new tokens and minimal removed metadata", async () => {
    const calls = [];
    const pageToken = "start/+? &=token";
    const nextPageToken = "next/+? &=token";
    const newStartPageToken = "new/+? &=token";
    const client = pbpCreateVocabDriveClient({
      identity: identityFixture(["start-token", "list-token", "end-token"]),
      fetchImpl: async (url) => {
        calls.push(String(url));
        return calls.length === 1
          ? jsonResponse({ startPageToken: pageToken })
          : calls.length === 2 ? jsonResponse({
            changes: [{ removed: true, fileId: "removed-id" }],
            nextPageToken
          }) : jsonResponse({ newStartPageToken });
      }
    });
    const start = await client.getStartPageToken();
    const middle = await client.listChanges(start.pageToken);
    const end = await client.listChanges(middle.nextPageToken);
    const changesResult = async (payload) => pbpCreateVocabDriveClient({
      identity: identityFixture(),
      fetchImpl: async () => jsonResponse(payload)
    }).listChanges(pageToken);
    const empty = await changesResult({ nextPageToken });
    const malformed = await Promise.all([
      changesResult({ changes: null, nextPageToken }),
      changesResult({ changes: 0, nextPageToken }),
      changesResult({ changes: {}, nextPageToken }),
      changesResult({ changes: [], nextPageToken: "" }),
      changesResult({ changes: [], newStartPageToken: 0 }),
      changesResult({ changes: [], nextPageToken, newStartPageToken }),
      changesResult({ changes: [] })
    ]);
    const startUrl = new URL(calls[0]);
    const listUrl = new URL(calls[1]);
    return start.ok && middle.ok && end.ok &&
      middle.nextPageToken === nextPageToken && middle.newStartPageToken === null &&
      end.nextPageToken === null && end.newStartPageToken === newStartPageToken &&
      startUrl.pathname === "/drive/v3/changes/startPageToken" &&
      startUrl.searchParams.toString() === "spaces=appDataFolder" &&
      listUrl.pathname === "/drive/v3/changes" &&
      listUrl.searchParams.get("pageToken") === pageToken &&
      listUrl.searchParams.get("spaces") === "appDataFolder" &&
      listUrl.searchParams.get("includeRemoved") === "true" &&
      listUrl.searchParams.get("fields") ===
        "nextPageToken,newStartPageToken,changes(removed,fileId,file(id,name,appProperties,parents,mimeType))" &&
      empty.ok && empty.changes.length === 0 &&
      malformed.every((result) => !result.ok && result.error === "invalid_response");
  });

  await asyncCheck("error results expose no token or remote/user body", async () => {
    const secrets = [
      "secret-auth-token", "Défense", "private note", "secret gloss",
      "https://private.example/article", "private-response-body"
    ];
    const client = pbpCreateVocabDriveClient({
      identity: identityFixture([secrets[0]]),
      fetchImpl: async () => new Response(secrets.slice(1).join(" "), { status: 503 })
    });
    const result = await client.download("opaque-secret-file-id");
    const invalidJson = await pbpCreateVocabDriveClient({
      identity: identityFixture([secrets[0]]),
      fetchImpl: async () => new Response(secrets.slice(1).join(" "), { status: 200 })
    }).about();
    const readerError = await pbpCreateVocabDriveClient({
      identity: identityFixture([secrets[0]]),
      fetchImpl: async () => ({
        ok: true,
        status: 200,
        headers: new Headers(),
        body: {
          getReader() {
            return {
              async read() { throw new Error(secrets.slice(1).join(" ")); },
              async cancel() {}
            };
          }
        }
      })
    }).download("opaque-secret-file-id");
    const visible = JSON.stringify([result, invalidJson, readerError]);
    return !result.ok && result.retryable === true &&
      !invalidJson.ok && invalidJson.error === "invalid_response" &&
      !readerError.ok && readerError.error === "network" &&
      result.fileId === "opaque-s" &&
      !visible.includes("opaque-secret-file-id") &&
      secrets.every((secret) => !visible.includes(secret));
  });

  document.getElementById("summary").textContent = `pass=${pass} fail=${fail}`;
})();
