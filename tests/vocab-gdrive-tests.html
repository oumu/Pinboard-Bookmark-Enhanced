<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Vocabulary Google Drive Tests</title>
<style>
body { font-family: monospace; padding: 16px; max-width: 1000px; }
.case { padding: 6px; border-bottom: 1px solid #eee; white-space: pre-wrap; }
.pass { color: #0a0; } .fail { color: #c00; font-weight: bold; }
</style></head><body>
<h1>Vocabulary Google Drive Tests</h1><div id="summary"></div><div id="results"></div>
<script src="../vocab-store.js"></script>
<script src="../vocab-gdrive.js"></script>
<script>
const root = document.getElementById("results");
const TEST_MAX_BYTES = 4 * 1024 * 1024;
const OWNER_HASH = "a".repeat(64);
const OTHER_OWNER_HASH = "b".repeat(64);
const DEVICE_ID = "device-a";
const DRIVE_FILE_ID = "file:opaque+id";
const OWNER_SCOPE = "acct_pin-a";
const ENVELOPE = { ownerHash: OWNER_HASH, deviceId: DEVICE_ID, createdAt: 123 };
let pass = 0, fail = 0;
function check(name, cond, detail) {
  const ok = !!cond; ok ? pass++ : fail++;
  const row = document.createElement("div");
  row.className = "case " + (ok ? "pass" : "fail");
  row.textContent = `${ok ? "✓" : "✗"} ${name}${ok ? "" : "\n   " + (detail || "")}`;
  root.appendChild(row);
}
function attempt(fn) { try { return fn(); } catch (_) { return false; } }
function throws(fn) { try { fn(); return false; } catch (_) { return true; } }
function bytes(value) { return new TextEncoder().encode(value).length; }
function live(term = "Word", language = "en", patch = {}, deviceId = DEVICE_ID) {
  const recordKey = pbpDictPrimaryLang(language) + "|" + pbpDictNormalizeTerm(term).toLowerCase();
  return {
    recordKey, vector: { [deviceId]: 1 }, dot: { deviceId, counter: 1 }, deleted: false,
    value: {
      term, lemma: term.toLowerCase(), language, gloss: "gloss", ipa: null,
      sourceUrl: "https://example.test/word", license: "CC0", contexts: [], groups: [],
      note: "", status: "new", createdAt: 10, updatedAt: 20, ...patch
    }
  };
}
function tombstone(term = "Gone") {
  const entry = live(term);
  return { recordKey: entry.recordKey, vector: entry.vector, dot: entry.dot, deleted: true };
}
function bodyObject(entries, envelope = ENVELOPE) {
  return {
    schema: 1, ownerHash: envelope.ownerHash, deviceId: envelope.deviceId,
    createdAt: envelope.createdAt, entries
  };
}
function bodyString(entries, envelope = ENVELOPE) {
  return JSON.stringify(bodyObject(entries, envelope));
}
function sizedEntry(targetBodyBytes, term) {
  const entry = live(term);
  const padding = targetBodyBytes - bytes(bodyString([entry]));
  if (padding < 0) throw new Error("target body is too small");
  entry.value.note = "x".repeat(padding);
  return entry;
}
function metadata(ownerHash = OWNER_HASH, deviceId = DEVICE_ID) {
  return pbpVocabDriveMetadata(DRIVE_FILE_ID, ownerHash, deviceId);
}
function splitBodiesValidate(result, envelope = ENVELOPE) {
  return result.ok && result.batches.every((batch) =>
    pbpVocabValidateDriveBatch(metadata(envelope.ownerHash, envelope.deviceId), batch.body, envelope.ownerHash));
}
async function asyncCheck(name, fn) {
  try { check(name, await fn()); } catch (error) { check(name, false, error && error.message); }
}
function identityFixture(tokens = ["token-a"]) {
  let index = 0;
  const calls = [];
  const removed = [];
  return {
    calls,
    removed,
    async getAuthToken(options) {
      calls.push({ ...options });
      const value = tokens[Math.min(index++, tokens.length - 1)];
      if (value instanceof Error) throw value;
      return { token: value };
    },
    async removeCachedAuthToken(details) { removed.push(details.token); }
  };
}
function jsonResponse(value, status = 200, headers) {
  return new Response(JSON.stringify(value), {
    status,
    headers: { "Content-Type": "application/json", ...headers }
  });
}
function readerResponse(chunks, onCancel, headers = {}) {
  let index = 0;
  return {
    ok: true,
    status: 200,
    headers: new Headers(headers),
    body: {
      getReader() {
        return {
          async read() {
            return index < chunks.length
              ? { done: false, value: chunks[index++] }
              : { done: true, value: undefined };
          },
          async cancel() { if (onCancel) onCancel(); }
        };
      }
    }
  };
}
function driveFile(fileId, term = fileId, deviceId = "device-b") {
  const meta = pbpVocabDriveMetadata(fileId, OWNER_HASH, deviceId);
  return { meta, body: bodyString([live(term, "en", {}, deviceId)], { ...ENVELOPE, deviceId }) };
}
function syncHarness(options = {}) {
  const calls = [];
  const ownerArgs = [];
  const hashInputs = [];
  const files = new Map((options.files || []).map((file) => [file.meta.id, file]));
  const filePages = [...(options.filePages || [{ files: [], nextPageToken: null }])];
  const changePages = [...(options.changePages || [{
    changes: [], nextPageToken: null, newStartPageToken: "stable-new"
  }])];
  const aboutResults = [...(options.aboutResults || [])];
  const seedResults = [...(options.seedResults || [0])];
  const pending = [...(options.pending || [])];
  const outbox = [...(options.outbox || [])];
  let accountState = options.accountState ? { ...options.accountState } : null;
  let preflightState = options.preflightState ? { ...options.preflightState } : null;
  let authAccount = options.authAccount || "pin-a";
  let authEpoch = 1;
  const auth = () => ({ account: authAccount, epoch: authEpoch, token: "pin-token" });
  const store = {
    async getMeta() { return { deviceId: DEVICE_ID, counter: 1 }; },
    async getPreflightState() {
      calls.push("get-preflight");
      return preflightState && { ...preflightState };
    },
    async putPreflightState(value) {
      calls.push(`put-preflight:${value.lastError || ""}:${value.blocked === true}`);
      preflightState = { ...value };
      return true;
    },
    async deletePreflightState() {
      calls.push("delete-preflight");
      preflightState = null;
      return true;
    },
    async getAccountState() { return accountState && { ...accountState }; },
    async putAccountState(state) {
      calls.push(`put:${state.pageToken || ""}:${state.bootstrapComplete === true}`);
      accountState = { ...state };
      return true;
    },
    async seedLegacy(owner, limit) {
      ownerArgs.push(owner);
      calls.push(`seed:${limit}`);
      const next = seedResults.shift();
      if (next instanceof Error) throw next;
      return { ok: true, processed: next ?? 0 };
    },
    async applyRemotePage(owner, _ownerHash, batches, cursorCommit) {
      ownerArgs.push(owner);
      calls.push(`apply:${batches.length}:${cursorCommit?.pageToken || cursorCommit?.bootstrapFilePageToken || cursorCommit?.bootstrapChangePageToken || ""}`);
      if (options.failApply) return { ok: false, error: "remote_batch", batchIndex: 0 };
      if (cursorCommit) accountState = { ...cursorCommit };
      return { ok: true, applied: batches.length, merged: 0, ignored: 0 };
    },
    async checkpointOwner(owner) { ownerArgs.push(owner); calls.push("checkpoint"); return 1; },
    async listPendingBatches() { return pending.map((row) => ({ ...row })); },
    async deletePendingBatch(_permissionId, _ownerHash, fileId) {
      calls.push(`delete-pending:${fileId}`);
      const index = pending.findIndex((row) => row.driveFileId === fileId);
      if (index >= 0) pending.splice(index, 1);
      return true;
    },
    async listOutbox(owner) {
      ownerArgs.push(owner);
      return outbox.map((row) => ({ ...row }));
    },
    async freezeOutbox(owner, permissionId, ownerHash, fileId, envelope) {
      ownerArgs.push(owner);
      calls.push(`freeze:${fileId}`);
      const parsed = JSON.parse(envelope.body);
      for (const entry of parsed.entries) {
        const index = outbox.findIndex((row) =>
          row.owner === owner && row.recordKey === entry.recordKey &&
          pbpVocabEventContentEqual(row.event, entry));
        if (index >= 0) outbox.splice(index, 1);
      }
      const row = {
        drivePermissionId: permissionId, ownerHash, driveFileId: fileId,
        body: envelope.body, createdAt: 1
      };
      pending.push(row);
      if (options.afterFreeze) options.afterFreeze({ outbox, row });
      return row;
    }
  };
  const client = {
    async openSession(interactive = false) {
      calls.push(`open-session:${interactive}`);
      const opened = interactive ? await client.connect() : await client.about();
      if (!opened.ok) return opened;
      return Object.assign({
        ...opened,
        about: client.about,
        getStartPageToken: client.getStartPageToken,
        listFiles: client.listFiles,
        listChanges: client.listChanges,
        download: client.download,
        generateId: client.generateId,
        upload: client.upload
      }, options.sessionOverrides || {});
    },
    async connect() { calls.push("connect"); return client.about(); },
    async about() {
      calls.push("about");
      if (options.afterAbout) options.afterAbout({
        setAccount(value) { authAccount = value; authEpoch++; }
      });
      return aboutResults.shift() ||
        { ok: true, permissionId: "perm-a", emailAddress: "a@example.test", displayName: "A" };
    },
    async getStartPageToken() { calls.push("start"); return { ok: true, pageToken: "start-T" }; },
    async listFiles(_ownerHash, pageToken) {
      calls.push(`files:${pageToken || ""}`);
      const page = filePages.shift();
      return page
        ? (page.ok === undefined ? { ok: true, ...page } : page)
        : { ok: false, error: "unexpected", retryable: false };
    },
    async listChanges(pageToken) {
      calls.push(`changes:${pageToken}`);
      const page = changePages.shift();
      return page
        ? (page.ok === undefined ? { ok: true, ...page } : page)
        : { ok: false, error: "unexpected", retryable: false };
    },
    async download(fileId) {
      calls.push(`download:${fileId}`);
      if (options.afterDownload) options.afterDownload({
        setAccount(value) { authAccount = value; authEpoch++; }
      });
      const file = files.get(fileId);
      return file ? { ok: true, body: file.body } : { ok: false, error: "remote", retryable: false };
    },
    async generateId() {
      const fileId = options.generatedId || "generated-batch";
      calls.push(`generate:${fileId}`);
      return { ok: true, fileId };
    },
    async upload(meta, body) {
      calls.push(`upload:${meta.id}:${body}`);
      return options.uploadResult || { ok: true, fileId: meta.id };
    }
  };
  const alarms = options.alarms || {
    created: [],
    async clear(name) { calls.push(`clear:${name}`); return true; },
    create(name, info) { this.created.push({ name, info }); calls.push(`alarm:${name}`); }
  };
  const runner = () => pbpCreateVocabDriveSyncRunner({
    client,
    store,
    alarms,
    getCurrentPinboardAuth: async () => auth(),
    pinboardAuthIsCurrent: (captured) =>
      captured.account === authAccount && captured.epoch === authEpoch,
    hashOwner: async (value) => { hashInputs.push(value); return OWNER_HASH; },
    now: options.now || (() => 1_000_000),
    random: options.random || (() => 0.5)
  });
  return {
    calls, client, store, alarms, outbox, pending, ownerArgs, hashInputs, runner,
    state: () => accountState && { ...accountState },
    preflight: () => preflightState && { ...preflightState },
    setAccount(value) { authAccount = value; authEpoch++; }
  };
}

(async () => {
  let ownerHash = null;
  try { ownerHash = await pbpVocabOwnerHash("abc"); } catch (_) {}
  check("SHA-256 owner hash", ownerHash === "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad");
  check("owner hash is 64 lowercase hex", attempt(() => /^[0-9a-f]{64}$/.test(ownerHash) && ownerHash.length === 64));

  check("metadata fixes Drive batch fields", attempt(() => {
    const meta = metadata();
    const entry = live();
    const body = bodyString([entry]);
    const exact = JSON.stringify(meta) === JSON.stringify({
      id: DRIVE_FILE_ID, name: `pbp-vocab-${DRIVE_FILE_ID}.json`,
      parents: ["appDataFolder"], mimeType: "application/json",
      appProperties: { pbpKind: "vocab-batch", schema: "1", owner: OWNER_HASH, device: DEVICE_ID }
    });
    const missingId = { ...meta };
    delete missingId.id;
    const wrongKind = { ...meta, appProperties: { ...meta.appProperties, pbpKind: "other" } };
    const wrongSchema = { ...meta, appProperties: { ...meta.appProperties, schema: "2" } };
    return exact && pbpVocabValidateDriveBatch(meta, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(missingId, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch({ ...meta, id: "other:id" }, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch({ ...meta, name: "pbp-vocab-other.json" }, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch({ ...meta, mimeType: "text/plain" }, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(wrongKind, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(wrongSchema, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch({ ...meta, modifiedTime: "unexpected" }, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch({ ...meta, parents: ["root"] }, body, OWNER_HASH);
  }));

  check("appProperties contain no username email or token", attempt(() => {
    const meta = metadata();
    const body = bodyString([live()]);
    const serialized = JSON.stringify(meta);
    const leaked = { ...meta, appProperties: { ...meta.appProperties, email: "alice@example.com" } };
    const token = { ...meta, appProperties: { ...meta.appProperties, token: "secret-token" } };
    return !serialized.includes("alice@example.com") && !serialized.includes("secret-token") &&
      !pbpVocabValidateDriveBatch(leaked, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(token, body, OWNER_HASH);
  }));

  check("body uses canonical schema and stable construction", attempt(() => {
    const entry = live();
    const split = pbpVocabSplitDriveEntries([entry], ENVELOPE);
    const exact = JSON.stringify({
      schema: 1, ownerHash: OWNER_HASH, deviceId: DEVICE_ID, createdAt: 123, entries: [entry]
    });
    const extra = JSON.stringify({ ...bodyObject([entry]), cursor: "secret" });
    return splitBodiesValidate(split) && split.batches[0].body === exact &&
      !pbpVocabValidateDriveBatch(metadata(), "{bad json", OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(metadata(), extra, OWNER_HASH);
  }));

  check("deleted entry has no value", attempt(() => {
    const entry = tombstone();
    const withValue = { ...entry, value: live().value };
    return pbpVocabValidateDriveBatch(metadata(), bodyString([entry]), OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(metadata(), bodyString([withValue]), OWNER_HASH);
  }));

  check("live entry requires value", attempt(() => {
    const entry = live();
    delete entry.value;
    return !pbpVocabValidateDriveBatch(metadata(), bodyString([entry]), OWNER_HASH);
  }));

  check("entry is owner-free", attempt(() => {
    const entry = live();
    const body = bodyString([entry]);
    const ownerField = { ...entry, owner: "acct_alice" };
    const tokenField = { ...entry, token: "secret-token" };
    const valueOwner = { ...entry, value: { ...entry.value, owner: "acct_alice" } };
    const sparseGroups = live("Sparse Groups");
    const sparseContexts = live("Sparse Contexts");
    sparseGroups.value.groups = new Array(1);
    sparseContexts.value.contexts = new Array(1);
    return !body.includes("acct_alice") &&
      !pbpVocabValidateDriveBatch(metadata(), bodyString([ownerField]), OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(metadata(), bodyString([tokenField]), OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(metadata(), bodyString([valueOwner]), OWNER_HASH) &&
      !pbpVocabSplitDriveEntries([sparseGroups], ENVELOPE).ok &&
      !pbpVocabSplitDriveEntries([sparseContexts], ENVELOPE).ok;
  }));

  check("UTF-8 byte count is exact for multibyte data", attempt(() => {
    const split = pbpVocabSplitDriveEntries([live("Défense", "fr", { gloss: "é中🙂" })], ENVELOPE);
    return splitBodiesValidate(split) && split.batches[0].bytes === bytes(split.batches[0].body) &&
      split.batches[0].bytes > split.batches[0].body.length;
  }));

  check("at-or-under 4 MiB boundary is accepted", attempt(() => {
    const split = pbpVocabSplitDriveEntries([sizedEntry(TEST_MAX_BYTES, "Limit")], ENVELOPE);
    return splitBodiesValidate(split) && split.batches.length === 1 &&
      split.batches[0].bytes === TEST_MAX_BYTES &&
      split.batches[0].bytes === PBP_VOCAB_BATCH_MAX_BYTES;
  }));

  check("entries split across batches in order", attempt(() => {
    const entries = ["First", "Second", "Third"].map((term) => {
      const entry = live(term);
      entry.value.note = "x".repeat(Math.floor(TEST_MAX_BYTES / 2) + 100);
      return entry;
    });
    const split = pbpVocabSplitDriveEntries(entries, ENVELOPE);
    const empty = pbpVocabSplitDriveEntries([], ENVELOPE);
    const keys = split.batches.flatMap((batch) => JSON.parse(batch.body).entries.map((entry) => entry.recordKey));
    return splitBodiesValidate(split) && empty.ok && empty.batches.length === 0 &&
      split.batches.length > 1 &&
      keys.join(",") === entries.map((entry) => entry.recordKey).join(",") &&
      split.batches.every((batch) => batch.bytes <= TEST_MAX_BYTES);
  }));

  check("a single entry is never split", attempt(() => {
    const entry = sizedEntry(TEST_MAX_BYTES - 1, "Whole");
    const split = pbpVocabSplitDriveEntries([entry], ENVELOPE);
    const stored = JSON.parse(split.batches[0].body).entries;
    return splitBodiesValidate(split) && split.batches.length === 1 && stored.length === 1 &&
      JSON.stringify(stored[0]) === JSON.stringify(entry);
  }));

  check("oversized entry is a permanent entry_too_large result", attempt(() => {
    const entry = sizedEntry(TEST_MAX_BYTES + 1, "Oversized");
    const result = pbpVocabSplitDriveEntries([entry], ENVELOPE);
    return JSON.stringify(result) === JSON.stringify({
      ok: false, error: "entry_too_large", recordKey: entry.recordKey, bytes: TEST_MAX_BYTES + 1
    });
  }));

  check("invalid noncanonical recordKey rejects the batch", attempt(() => {
    const entry = live();
    entry.recordKey = "EN|Word";
    return !pbpVocabValidateDriveBatch(metadata(), bodyString([entry]), OWNER_HASH);
  }));

  check("ownerHash mismatch rejects the whole batch", attempt(() => {
    const body = bodyString([live()]);
    const uppercase = OWNER_HASH.toUpperCase();
    const uppercaseMeta = metadata();
    uppercaseMeta.appProperties.owner = uppercase;
    return !pbpVocabValidateDriveBatch(metadata(), body, OTHER_OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(uppercaseMeta, bodyString([live()], { ...ENVELOPE, ownerHash: uppercase }), uppercase) &&
      !pbpVocabValidateDriveBatch(metadata(), body, "not-a-hash");
  }));

  check("metadata and body device mismatch rejects", attempt(() => {
    const mismatch = bodyString([live("Word", "en", {}, "device-b")], { ...ENVELOPE, deviceId: "device-b" });
    const nonNfcDevice = "e\u0301";
    const longDevice = "界".repeat(40);
    const invalidBody = bodyString([live("Word", "en", {}, nonNfcDevice)], { ...ENVELOPE, deviceId: nonNfcDevice });
    const longBody = bodyString([live("Word", "en", {}, longDevice)], { ...ENVELOPE, deviceId: longDevice });
    const nonNfcMetadata = metadata();
    const emptyMetadata = metadata();
    const longMetadata = metadata();
    nonNfcMetadata.appProperties.device = nonNfcDevice;
    emptyMetadata.appProperties.device = "";
    longMetadata.appProperties.device = longDevice;
    return !pbpVocabValidateDriveBatch(metadata(), mismatch, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(nonNfcMetadata, invalidBody, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(emptyMetadata, bodyString([live()], { ...ENVELOPE, deviceId: "" }), OWNER_HASH) &&
      throws(() => pbpVocabDriveMetadata(DRIVE_FILE_ID, OWNER_HASH, longDevice)) &&
      !pbpVocabValidateDriveBatch(longMetadata, longBody, OWNER_HASH) &&
      !pbpVocabSplitDriveEntries([live()], { ...ENVELOPE, deviceId: longDevice }).ok;
  }));

  check("multipart contains metadata and exact frozen JSON body", attempt(() => {
    const meta = metadata();
    const frozen = bodyString([live("Multipart", "en", { note: "pbp-vocab-boundary" })]);
    const multipart = pbpVocabBuildMultipart(meta, frozen);
    const boundary = multipart.contentType.match(/^multipart\/related; boundary=(.+)$/)[1];
    const metadataJson = JSON.stringify(meta);
    return metadataJson.includes(`"id":"${DRIVE_FILE_ID}"`) &&
      boundary.length === 40 && boundary.length <= 70 && /^pbp-[0-9a-f-]{36}$/i.test(boundary) &&
      !metadataJson.includes(boundary) && !frozen.includes(boundary) &&
      multipart.body.includes("\r\n\r\n" + metadataJson + "\r\n--" + boundary) &&
      multipart.body.includes("\r\n\r\n" + frozen + "\r\n--" + boundary + "--") &&
      multipart.body.indexOf(frozen) === multipart.body.lastIndexOf(frozen);
  }));

  await asyncCheck("Drive auth is noninteractive by default", async () => {
    const identity = identityFixture();
    const client = pbpCreateVocabDriveClient({
      identity,
      fetchImpl: async () => jsonResponse({ user: { permissionId: "perm-a" } })
    });
    const result = await client.about();
    return result.ok && identity.calls.length === 1 && identity.calls[0].interactive === false;
  });

  await asyncCheck("interactive auth is confined to explicit connect", async () => {
    const identity = identityFixture(["connect-token", "background-token"]);
    const client = pbpCreateVocabDriveClient({
      identity,
      fetchImpl: async (url) => String(url).includes("generateIds")
        ? jsonResponse({ ids: ["generated-id"] })
        : jsonResponse({ user: { permissionId: "perm-a" } })
    });
    const connected = await client.connect();
    const generated = await client.generateId();
    return connected.ok && generated.ok && identity.calls.length === 2 &&
      identity.calls[0].interactive === true && identity.calls[1].interactive === false;
  });

  await asyncCheck("about.get requests exact minimal fields", async () => {
    const calls = [];
    const client = pbpCreateVocabDriveClient({
      identity: identityFixture(),
      fetchImpl: async (url, init) => {
        calls.push({ url: String(url), init });
        return jsonResponse({ user: {
          permissionId: "perm-a", emailAddress: "a@example.test", displayName: "A"
        } });
      }
    });
    const result = await client.about();
    const url = new URL(calls[0].url);
    return result.ok && result.permissionId === "perm-a" &&
      url.origin === "https://www.googleapis.com" && url.pathname === "/drive/v3/about" &&
      url.searchParams.toString() ===
        "fields=user%28permissionId%2CemailAddress%2CdisplayName%29" &&
      calls[0].init.method === "GET";
  });

  await asyncCheck("about.get fails closed without permissionId", async () => {
    const client = pbpCreateVocabDriveClient({
      identity: identityFixture(),
      fetchImpl: async () => jsonResponse({ user: { emailAddress: "a@example.test" } })
    });
    const result = await client.about();
    return !result.ok && result.error === "invalid_response" && result.retryable === false;
  });

  await asyncCheck("first 401 evicts token and retries exactly once", async () => {
    const identity = identityFixture(["old-token", "new-token"]);
    let fetches = 0;
    const client = pbpCreateVocabDriveClient({
      identity,
      fetchImpl: async () => ++fetches === 1
        ? new Response(null, { status: 401 })
        : jsonResponse({ user: { permissionId: "perm-a" } })
    });
    const result = await client.about();
    const sessionIdentity = identityFixture(["session-a", "session-b"]);
    const sessionFetches = [];
    const sessionClient = pbpCreateVocabDriveClient({
      identity: sessionIdentity,
      fetchImpl: async (url, init) => {
        const call = {
          path: new URL(url).pathname,
          auth: init.headers.Authorization
        };
        sessionFetches.push(call);
        if (call.path === "/drive/v3/about") {
          return jsonResponse({ user: {
            permissionId: call.auth === "Bearer session-a" ? "perm-a" : "perm-b"
          } });
        }
        return new Response(null, { status: 401 });
      }
    });

        key: `account:perm-a:${OWNER_HASH}`, drivePermissionId: "perm-a",
        ownerHash: OWNER_HASH, bootstrapComplete: true, pageToken: "stable-old"
      },
      changePages: [{
        ok: true, changes: [{ removed: false, fileId: remote.meta.id, file: remote.meta }],
        nextPageToken: null, newStartPageToken: "must-not-commit"
      }]
    });
    const result = await h.runner()();
    const ok = !result.ok && result.error === "corrupt" &&
      h.state().pageToken === "stable-old";
    if (!ok) throw new Error(JSON.stringify({ result, state: h.state(), calls: h.calls }));
    return true;
  });

  await asyncCheck("removed changes never become local deletes", async () => {
    const h = syncHarness({
      accountState: {
        key: `account:perm-a:${OWNER_HASH}`, drivePermissionId: "perm-a",
        ownerHash: OWNER_HASH, bootstrapComplete: true, pageToken: "stable-old"
      },
      changePages: [{
        ok: true, changes: [{ removed: true, fileId: "removed" }],
        nextPageToken: null, newStartPageToken: "stable-new"
      }]
    });
    const result = await h.runner()();
    return result.ok && !h.calls.some((call) => call.startsWith("download:")) &&
      !h.calls.some((call) => call === "apply:1:stable-new");
  });

  await asyncCheck("removed changes checkpoint after remaining downloads", async () => {
    const remote = driveFile("after-removal");
    const h = syncHarness({
      files: [remote],
      accountState: {
        key: `account:perm-a:${OWNER_HASH}`, drivePermissionId: "perm-a",
        ownerHash: OWNER_HASH, bootstrapComplete: true, pageToken: "stable-old"
      },
      changePages: [
        {
          ok: true,
          changes: [
            { removed: true, fileId: "removed" },
            { removed: false, fileId: remote.meta.id, file: remote.meta }
          ],
          nextPageToken: "after-removed", newStartPageToken: null
        },
        { ok: false, error: "server", retryable: true },
        {
          ok: true, changes: [],
          nextPageToken: null, newStartPageToken: "stable-new"
        }
      ]
    });
    const interrupted = await h.runner()();
    const persistedFlag = h.state()?.needsCheckpoint === true &&
      h.state()?.pageToken === "after-removed";
    const resumed = await h.runner()({ force: true });
    return !interrupted.ok && interrupted.error === "network" && persistedFlag &&
      resumed.ok && h.calls.filter((call) => call === "checkpoint").length === 1 &&
      h.state().pageToken === "stable-new" &&
      h.state().needsCheckpoint === undefined;
  });

  await asyncCheck("legacy seed loops in batches of one hundred", async () => {
    const h = syncHarness({ seedResults: [100, 100, 0] });
    const result = await h.runner()();
    return result.ok &&
      h.calls.filter((call) => call.startsWith("seed:")).join(",") === "seed:100,seed:100,seed:100" &&
      h.calls.indexOf("start") > h.calls.lastIndexOf("seed:100");
  });

  await asyncCheck("interrupted legacy seed resumes from committed store work", async () => {
    const h = syncHarness({ seedResults: [100, new Error("worker stopped"), 0] });
    const first = await h.runner()();
    const firstPreflight = h.preflight();
    const firstStarts = h.calls.filter((call) => call === "start").length;
    const second = await h.runner()();
    return !first.ok && first.error === "remote" && firstPreflight === null &&
      second.ok && firstStarts === 0 &&
      h.calls.filter((call) => call === "start").length === 1;
  });

  await asyncCheck("freezing a batch removes the outbox snapshot", async () => {
    const event = live("Frozen");
    const h = syncHarness({
      outbox: [{ key: `outbox:${OWNER_SCOPE}:${event.recordKey}`, owner: OWNER_SCOPE, recordKey: event.recordKey, event }]
    });
    const result = await h.runner()();
    return result.ok && h.calls.includes("freeze:generated-batch") &&
      h.outbox.length === 0 && h.pending.length === 0;
  });

  await asyncCheck("a mutation after freeze remains in the outbox", async () => {
    const event = live("Refrozen");
    const newer = {
      ...event,
      vector: { [DEVICE_ID]: 2 },
      dot: { deviceId: DEVICE_ID, counter: 2 },
      value: { ...event.value, note: "newer" }
    };
    const h = syncHarness({
      outbox: [{ key: `outbox:${OWNER_SCOPE}:${event.recordKey}`, owner: OWNER_SCOPE, recordKey: event.recordKey, event }],
      afterFreeze({ outbox }) {
        outbox.push({
          key: `outbox:${OWNER_SCOPE}:${newer.recordKey}`, owner: OWNER_SCOPE,
          recordKey: newer.recordKey, event: newer
        });
      }
    });
    const result = await h.runner()();
    return result.ok && h.outbox.length === 1 &&
      h.outbox[0].event.value.note === "newer";
  });

  await asyncCheck("pending upload reuses the frozen file ID and exact body", async () => {
    const frozen = bodyString([live("Pending")]);
    const h = syncHarness({
      pending: [{
        drivePermissionId: "perm-a", ownerHash: OWNER_HASH,
        driveFileId: "pending-fixed", body: frozen, createdAt: 1
      }]
    });
    const result = await h.runner()();
    const switched = syncHarness({
      pending: [{
        drivePermissionId: "perm-a", ownerHash: OWNER_HASH,
        driveFileId: "pending-switched", body: frozen, createdAt: 1
      }],
      sessionOverrides: {
        async upload() {
          return { ok: false, error: "account_changed", retryable: false };
        }
      }
    });
    const switchedResult = await switched.runner()();
    return result.ok && h.calls.includes(`upload:pending-fixed:${frozen}`) &&
      !h.calls.some((call) => call.startsWith("generate:")) &&
      !switchedResult.ok && switchedResult.error === "account_changed" &&
      !switched.calls.some((call) => call === "delete-pending:pending-switched");
  });

  await asyncCheck("periodic scheduling uses a fifteen-minute alarm", async () => {
    const alarms = { created: [], create(name, info) { this.created.push({ name, info }); } };
    await pbpVocabSchedulePeriodic(alarms);
    return JSON.stringify(alarms.created) === JSON.stringify([{
      name: "vocab-sync-periodic", info: { periodInMinutes: 15 }
    }]);
  });

  await asyncCheck("dirty scheduling uses an earliest thirty-second one-shot", async () => {
    const alarms = {
      existing: null, created: [],
      async get() { return this.existing; },
      create(name, info) { this.created.push({ name, info }); this.existing = { scheduledTime: info.when }; }
    };
    await pbpVocabScheduleDirty(alarms, () => 1_000);
    await pbpVocabScheduleDirty(alarms, () => 2_000);
    return alarms.created.length === 1 &&
      alarms.created[0].name === "vocab-sync-dirty" &&
      alarms.created[0].info.when === 31_000;
  });

  await asyncCheck("retry delay follows 1/2/4/8/16/32/60 minute cap", async () => {
    const delays = Array.from({ length: 9 }, (_, attempt) =>
      pbpVocabRetryDelayMinutes(attempt, () => 0.5));
    const h = syncHarness({
      accountState: {
        key: `account:perm-a:${OWNER_HASH}`, drivePermissionId: "perm-a",
        ownerHash: OWNER_HASH, bootstrapComplete: true, pageToken: "stable-old",
        retryAttempt: 6, retryAt: 9_999_999
      },
      changePages: [{ ok: false, error: "server", retryable: true }]
    });
    const result = await h.runner()({ force: true });
    const preflight = syncHarness({
      preflightState: {
        key: `preflight:${OWNER_HASH}`, ownerHash: OWNER_HASH,
        retryAttempt: 2, retryAt: 9_999_999, lastError: "network", blocked: false
      }
    });
    const waiting = await preflight.runner()();
    const waitingCalls = [...preflight.calls];
    const forced = await preflight.runner()({ force: true });
    const accountWait = syncHarness({
      accountState: {
        key: `account:perm-a:${OWNER_HASH}`, drivePermissionId: "perm-a",
        ownerHash: OWNER_HASH, bootstrapComplete: true, pageToken: "stable-old",
        retryAttempt: 2, retryAt: 9_999_999
      }
    });
    const accountWaiting = await accountWait.runner()();
    return delays.join(",") === "1,2,4,8,16,32,60,60,60" &&
      !result.ok && result.error === "network" &&
      h.state().retryAttempt === 1 && h.state().retryAt === 1_060_000 &&
      h.calls.indexOf("put:stable-old:true") < h.calls.indexOf("alarm:vocab-sync-retry") &&
      waiting.ok && waiting.status?.waitingForRetry === true &&
      waitingCalls.includes("alarm:vocab-sync-retry") &&
      !waitingCalls.some((call) =>
        call.startsWith("open-session:") || call === "about" || call.startsWith("changes:")) &&
      forced.ok && preflight.preflight() === null &&
      accountWaiting.ok && accountWaiting.status?.waitingForRetry === true &&
      accountWait.calls.includes("alarm:vocab-sync-retry");
  });

  await asyncCheck("retry delay applies bounded twenty-percent jitter", async () => {
    return Math.abs(pbpVocabRetryDelayMinutes(3, () => 0) - 6.4) < 1e-9 &&
      Math.abs(pbpVocabRetryDelayMinutes(3, () => 1) - 9.6) < 1e-9;
  });

  await asyncCheck("owner change after a network await stops before local commit", async () => {
    const remote = driveFile("owner-switch");
    const h = syncHarness({
      files: [remote],
      filePages: [{ ok: true, files: [remote.meta], nextPageToken: null }],
      afterDownload(control) { control.setAccount("pin-b"); }
    });
    const result = await h.runner()();
    const drive = syncHarness({
      aboutResults: [
        { ok: true, permissionId: "perm-a", emailAddress: "a@example.test", displayName: "A" },
        { ok: true, permissionId: "perm-b", emailAddress: "b@example.test", displayName: "B" }
      ]
    });
    const driveResult = await drive.runner()();
    const sessionSwitch = syncHarness({
      accountState: {
        key: `account:perm-a:${OWNER_HASH}`, drivePermissionId: "perm-a",
        ownerHash: OWNER_HASH, bootstrapComplete: true, pageToken: "stable-old"
      },
      sessionOverrides: {
        async listChanges() {
          return { ok: false, error: "account_changed", retryable: false };
        }
      }
    });
    const sessionSwitchResult = await sessionSwitch.runner()();
    return !result.ok && result.error === "account_changed" &&
      !h.calls.some((call) => call.startsWith("apply:")) &&
      !h.calls.some((call) => call.startsWith("upload:")) &&
      !driveResult.ok && driveResult.error === "account_changed" &&
      drive.calls.filter((call) => call === "about").length === 2 &&
      !sessionSwitchResult.ok && sessionSwitchResult.error === "account_changed" &&
      !sessionSwitch.calls.some((call) =>
        call.startsWith("apply:") || call.startsWith("upload:") ||
        call.startsWith("delete-pending:"));
  });

  document.getElementById("summary").textContent = `pass=${pass} fail=${fail}`;
})();
</script></body></html>
